  // 按日期分组当天出现过的运动记录——每次render()只读一次localStorage，
  // 日期循环里直接查这份分组结果，不用一天读一次。这里保留完整记录
  // （不只是sport名字），因为Strength类型要看muscles字段才能算出显示文字。
  // 这天命中了哪个节日水印——三个来源按优先级查：
  //   1. 笔记icon字段（可能是单日也可能是跨度，覆盖到的话都算命中；跟
  //      coverEventsForDate同一套"这天是否落在start~end之间"判断逻辑）
  //   2. category-registry「## 节日」小节（每年重复的固定月日）
  //   3. HOLIDAYS.lunar（写死在代码里的春节查表，农历没法在Obsidian里配置）
  // 查不到就是没配置/年份没录，安静返回null，不报警告。笔记icon事件同一天
  // 撞上好几个（不同emoji）的话不报警告，安静选一个——挑跨度最短的（更
  // 具体，大概率是刻意标注的），完全同长按数组顺序。
  holidayIconForDate(y, m, d){
    const jsDate = new Date(y, m-1, d);
    const hits = (Store.iconEvents||[]).filter(ev=>{
      const s = dateObjToJSDate(ev.start, false);
      const e = ev.end==='ongoing' ? NOW : dateObjToJSDate(ev.end, true);
      return jsDate>=s && jsDate<=e;
    });
    if(hits.length){
      let best = hits[0], bestDays = daysBetweenDateOnly(dateObjToJSDate(best.start,false), best.end==='ongoing'?NOW:dateObjToJSDate(best.end,true));
      for(let i=1;i<hits.length;i++){
        const h = hits[i];
        const days = daysBetweenDateOnly(dateObjToJSDate(h.start,false), h.end==='ongoing'?NOW:dateObjToJSDate(h.end,true));
        if(days<bestDays){ best = h; bestDays = days; }
      }
      return best.icon;
    }
    const fixedHit = (Store.holidayFixed||[]).find(h=>h.month===m && h.day===d);
    if(fixedHit) return fixedHit.icon;
    const mmdd = `${pad2(m)}-${pad2(d)}`;
    const lunarHit = HOLIDAYS.lunar.find(h=>h.dates[y]===mmdd);
    if(lunarHit) return lunarHit.icon;
    return null;
  },
  fitnessGroupedByDate(){
    const out = {};
    loadFitnessRecords().forEach(r=>{
      if(!r.date) return;
      (out[r.date] = out[r.date] || []).push(r);
    });
    return out;
  },
  // 一条运动记录最终要显示的文字——Strength类型不显示"Strength"这个笼统的
  // 运动类型名，改显示具体练的部位（读取Fitness.html自己的`muscles`字段，
  // 逗号分隔的字符串，兼容它的老字段名`sub`；两个以上部位用" & "连接，
  // 完全照抄Fitness.html自己的拼接格式，不是另起一套写法）；这条记录压根
  // 没填部位（老记录/漏填）就退回显示"💪 Strength"兜底。
  // Run类型同理不显示"Run"，改显示"距离·心率"（比如"5km · 150bpm"）——
  // 距离用km、心率用bpm，两个都是带单位的完整写法（Fitness.html自己的
  // 紧凑角标用的是不带单位的"5k·150"这种精简版，这里是在此基础上按
  // 用户要求把单位都补全，不是原样照抄），中间用" · "连接（前后各留一个
  // 空格，不然数字挤在一起不好读）；只有距离没有心率
  // （或反过来）就只显示有的那一项，两个都没填就退回显示"🏃 Run"兜底。
  // 其余类型照旧显示SPORT_LABEL里的图标+名字。
  fitnessDisplayLabel(r){
    if(r.sport==='Strength'){
      const muscles = (r.muscles || r.sub || '').split(',').map(s=>s.trim()).filter(Boolean);
      if(muscles.length) return `💪 ${muscles.join(' & ')}`;
    }
    if(r.sport==='Run'){
      const bits = [];
      if(r.dist) bits.push(`${r.dist}km`);
      if(r.hr) bits.push(`${r.hr}bpm`);
      if(bits.length) return `🏃 ${bits.join(' · ')}`;
    }
    return SPORT_LABEL[r.sport] || r.sport;
  },
  // 格子里固定摆在第一行的运动chip——最多平分两段；这一天如果有超过两种
  // 显示内容，第二段末尾缀"+N"，不新增第三段撑爆这一行（这行的定位是"一眼
  // 扫过去知道今天动没动"，不是把当天所有运动都列全，列全的需求可以点开
  // 格子看别处，或者以后有需要再加）。去重按"最终显示文字"去重，不是按
  // sport去重——同一天两次Strength但部位不一样（比如早上练腿、晚上练背），
  // 应该分别显示成两条，不能因为都是Strength就被合并成一条。
  fitnessRowHtml(records){
    if(!records || records.length===0) return '';
    const seen = new Set();
    const uniq = [];
    records.forEach(r=>{
      const label = this.fitnessDisplayLabel(r);
      if(!seen.has(label)){ seen.add(label); uniq.push({label, color: fitnessColorFor(r.sport)}); }
    });
    const shown = uniq.slice(0, 2);
    const extra = uniq.length - shown.length;
    const segW = shown.length===1 ? 100 : 50;
    const chips = shown.map((u,i)=>{
      const suffix = (i===shown.length-1 && extra>0) ? ` +${extra}` : '';
      const label = u.label + suffix;
      return `<div class="cal-fitness-chip" style="width:${segW}%;background:${u.color}22;color:${u.color}">${Utils.escapeHtml(label)}</div>`;
    }).join('');
    return `<div class="cal-fitness-row">${chips}</div>`;
  },
  // 月度汇总一行小字——"Runs: 5.2km (2x) · Walks: 3x"这种，已知运动类型
  // 按SPORT_LABEL登记的顺序排在前面，不认识的新类型按字母序附加在后面，
  // 这样Fitness.html以后加了新运动类型，这边不用改代码就能显示。
  monthFitnessSummary(y, m){
    const prefix = `${y}-${pad2(m)}`;
    const bySport = {};
    loadFitnessRecords().forEach(r=>{
      if(!r.date || !r.date.startsWith(prefix)) return;
      const sp = r.sport || '未知';
      if(!bySport[sp]) bySport[sp] = { count:0, dist:0 };
      bySport[sp].count++;
      if(sp==='Run' && typeof r.dist==='number') bySport[sp].dist += r.dist;
    });
    const keys = Object.keys(bySport);
    if(keys.length===0) return '';
    const known = Object.keys(SPORT_LABEL).filter(k=>bySport[k]);
    const extra = keys.filter(k=>!SPORT_LABEL[k]).sort();
    return known.concat(extra).map(sp=>{
      const label = SPORT_MONTH_LABEL[sp] || sp;
      const info = bySport[sp];
      if(sp==='Run' && info.dist>0) return `${label}: ${info.dist.toFixed(1)}km (${info.count}x)`;
      return `${label}: ${info.count}x`;
    }).join(' · ');
  },
  visibleData(raw){
    if(!raw) return null;
    const out = {};
    Object.keys(raw).forEach(k=>{
      if(State.hiddenMonthTags.has(k)) return;
      if(raw[k] && raw[k].length) out[k] = raw[k];
    });
    return Object.keys(out).length ? out : null;
  },
  // 当前月实际出现过哪些标签（含"未标记"桶）——不看开关状态，只看数据本身，
  // 所以翻月会跟着变，这个月没出现的标签不会占面板位置。
  collectMonthTags(y, m){
    const seen = [];
    const push = raw=>{ if(!raw) return; Object.keys(raw).forEach(k=>{ if(raw[k] && raw[k].length && !seen.includes(k)) seen.push(k); }); };
    const daysInMonth = new Date(y, m, 0).getDate();
    for(let d=1; d<=daysInMonth; d++) push(Store.entriesByDay[`${y}-${pad2(m)}-${pad2(d)}`]);
    push(Store.entriesByYearMonthUnplaced[`${y}-${pad2(m)}`]);
    // "未标记"固定排最后，视觉上跟正经分类分开，不占前排位置
    const idx = seen.indexOf(Parser.UNTAGGED_KEY);
    if(idx>-1){ seen.splice(idx,1); seen.push(Parser.UNTAGGED_KEY); }
    return seen;
  },
  renderTagChips(tags){
    const chipsEl = document.getElementById('calTagChips');
    // 这行的高度靠CSS min-height兜底，不管有没有标签都不隐藏整行——
    // 不然翻到没数据的月份，标签行一消失，日历栏跟着往上跳一截，很难看。
    if(tags.length===0){ chipsEl.innerHTML=''; return; }
    chipsEl.innerHTML = tags.map(key=>{
      const isUntagged = key===Parser.UNTAGGED_KEY;
      const label = isUntagged ? '未标记' : key;
      const color = isUntagged ? 'var(--muted)' : Parser.colorForCategory(key);
      const active = !State.hiddenMonthTags.has(key);
      return `<div class="cal-tag-chip${active?'':' inactive'}" data-tag-key="${Utils.escapeHtml(key)}">
        <span class="cal-tag-chip-dot" style="background:${color}"></span>${Utils.escapeHtml(label)}
      </div>`;
    }).join('');
    chipsEl.querySelectorAll('.cal-tag-chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.dataset.tagKey;
        if(State.hiddenMonthTags.has(key)) State.hiddenMonthTags.delete(key); else State.hiddenMonthTags.add(key);
        CalendarView.render();
      });
    });
  },
  // 跨度事件（旅游/出差这类，登记在「日历跨度分类」里）落在某一天时的cover信息——
  // 同一天撞上好几个的话，只挑第一个当色块主角，其余算进"+N"角标，展开详情
  // 文字列表里则是全部都列出来，不丢信息，只是色块视觉上只能占一个。
  coverEventsForDate(jsDate){
    const cats = Store.calendarSpanCategories || [];
    if(cats.length===0) return [];
    return (Store.spanEvents||[]).filter(ev=>{
      if(!cats.includes(ev.category)) return false;
      const s = dateObjToJSDate(ev.start, false);
      const e = ev.end==='ongoing' ? NOW : dateObjToJSDate(ev.end, true);
      return jsDate>=s && jsDate<=e;
    });
  },
  // 媒体（观影这类，媒体分类里带"【Calendar】"标记的那些）落在某一天时要额外
  // 显示的纯文字行——必须精确到"天"（起止都是day精度）才能定位到具体格子，
  // 只精确到月/年的媒体记录日历管不着，还是只在卡片墙露出；「## 时间线」
  // 里的重看点日期各自算一行，跟主date的起止跨度分开判断，互不影响。
  mediaLinesForDate(y, m, d){
    const cats = Store.mediaCalendarCategories || [];
    if(cats.length===0) return [];
    const jsDate = new Date(y, m-1, d);
    const lines = [];
    (Store.mediaItems||[]).forEach(item=>{
      if(!cats.includes(item.category)) return;
      if(item.start && item.start.precision==='day' && item.end && item.end!=='ongoing' && item.end.precision==='day'){
        const s = dateObjToJSDate(item.start, false);
        const e = dateObjToJSDate(item.end, true);
        if(jsDate>=s && jsDate<=e) lines.push({category:item.category, text:item.title});
      }
      (item.rewatches||[]).forEach(rw=>{
        if(rw.year===y && rw.month===m && rw.day===d){
          lines.push({category:item.category, text: rw.text ? `${item.title}·${rw.text}` : `${item.title}·重看`});
        }
      });
    });
    return lines;
  },
  // 跨度笔记（旅游/出差这类）落到具体某一天要显示的文字——只认「## 时间线」
  // 里精确对上这一天的那条内容（比如"5月2日 到达大理"），没有时间线条目
  // 覆盖到的那些天就纯用文件名；不额外解析正文其他自由段落——项目里目前
  // 就只有「## 时间线」这一种结构化小节被解析，以后正文要加别的结构化内容，
  // 单独按需再加对应的解析规则，不在这里预先猜一个"标题前面的文字"规则。
  // 全文完整显示，不做长度截断——折叠状态下靠CSS单行省略号收起，
  // 展开详情时应该能看到完整内容。
  spanEventDayText(ev, y, m, d){
    const match = (ev.timelineItems||[]).find(it=>it.year===y && it.month===m && it.day===d && it.text);
    if(match) return `${ev.title}·${match.text}`;
    return ev.title;
  },
  cellEntriesHtml(data, expanded, coverLines, mediaLines){
    const lines = [];
    if(data){
      Object.keys(data).forEach(cat=>{
        const color = cat===Parser.UNTAGGED_KEY ? 'var(--muted)' : Parser.colorForCategory(cat);
        (data[cat]||[]).forEach(entry=>{
          lines.push(`<div class="cal-entry-line"><span class="cal-entry-dot" style="background:${color}"></span><span>${Utils.escapeHtml(entry.text)}</span></div>`);
        });
      });
    }
    (coverLines||[]).forEach(cl=>{
      const color = Parser.colorForCategory(cl.category);
      lines.push(`<div class="cal-entry-line"><span class="cal-entry-dot" style="background:${color}"></span><span>${Utils.escapeHtml(cl.text)}</span></div>`);
    });
    (mediaLines||[]).forEach(ml=>{
      const color = Parser.colorForCategory(ml.category);
      lines.push(`<div class="cal-entry-line"><span class="cal-entry-dot" style="background:${color}"></span><span>${Utils.escapeHtml(ml.text)}</span></div>`);
    });
    if(expanded || lines.length <= this.MAX_LINES_COLLAPSED) return lines.join('');
    const shown = lines.slice(0, this.MAX_LINES_COLLAPSED);
    const restCount = lines.length - this.MAX_LINES_COLLAPSED;
    return shown.join('') + `<div class="cal-more">+${restCount} 更多，点开看</div>`;
  },
  render(){
    const y = State.year, m = State.month;
    // getDay()是"周日=0"，日历要周一开头，所以往后挪6天取模，把周一变成0
    const firstDow = (new Date(y, m-1, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(y, m, 0).getDate();
    const weekdayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    document.getElementById('calWeekdayRow').innerHTML =
      weekdayLabels.map(w=>`<div class="cal-weekday">${w}</div>`).join('');

    this.renderTagChips(this.collectMonthTags(y, m));
    document.getElementById('calFitnessSummary').textContent = this.monthFitnessSummary(y, m);

    // 空月提示跟开关状态无关——哪怕这个月的标签全被关掉了，这个月本身
    // "有没有记录"跟"显示不显示"是两件事，提示语只看有没有原始数据；
    // cover跨度事件/媒体日历文字/运动记录也都算"有记录"，不然一个月只有
    // 一趟旅游或者只运动过没写日记，会被误判成空月。
    const fitnessByDate = this.fitnessGroupedByDate();
    let anyDataThisMonth = false;
    for(let d=1; d<=daysInMonth; d++){
      const jsDate = new Date(y, m-1, d);
      const ds = `${y}-${pad2(m)}-${pad2(d)}`;
      if(Store.entriesByDay[ds]
        || this.coverEventsForDate(jsDate).length>0
        || this.mediaLinesForDate(y, m, d).length>0
        || (fitnessByDate[ds] && fitnessByDate[ds].length>0)){
        anyDataThisMonth = true; break;
      }
    }
    const rawUnplaced = Store.entriesByYearMonthUnplaced[`${y}-${pad2(m)}`] || null;

    const headLine = document.getElementById('calHeadLine');
    if(!anyDataThisMonth && !rawUnplaced){
      headLine.style.display = 'block';
      headLine.textContent = pickEmptyLine(`${y}-${pad2(m)}`);
    } else {
      headLine.style.display = 'none';
    }

    const unplaced = this.visibleData(rawUnplaced);
    const unplacedEl = document.getElementById('calUnplaced');
    if(unplaced){
      const lines = [];
      Object.keys(unplaced).forEach(cat=>{
        const color = cat===Parser.UNTAGGED_KEY ? 'var(--muted)' : Parser.colorForCategory(cat);
        unplaced[cat].forEach(entry=>{
          lines.push(`<div class="cal-unplaced-line"><span class="cal-entry-dot" style="background:${color}"></span><span>${Utils.escapeHtml(entry.text)}</span></div>`);
        });
      });
      unplacedEl.innerHTML = `<div class="cal-unplaced-label">本月还有几条没标具体日期</div>${lines.join('')}`;
      unplacedEl.style.display = 'block';
    } else {
      unplacedEl.style.display = 'none';
    }

    let cells = '';
    const todayStr = `${NOW.getFullYear()}-${pad2(NOW.getMonth()+1)}-${pad2(NOW.getDate())}`;
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${pad2(m)}-${pad2(d)}`;
      const jsDate = new Date(y, m-1, d);
      const data = this.visibleData(Store.entriesByDay[dateStr]);
      const coverEvs = this.coverEventsForDate(jsDate);
      const coverLines = coverEvs.map(ev=>({category:ev.category, text:this.spanEventDayText(ev, y, m, d)}));
      const mediaLines = this.mediaLinesForDate(y, m, d);
      const fitnessRow = this.fitnessRowHtml(fitnessByDate[dateStr]);
      const holidayIcon = this.holidayIconForDate(y, m, d);
      const expanded = State.expandedDays.has(dateStr);
      const hasContent = !!data || coverEvs.length>0 || mediaLines.length>0 || !!fitnessRow;
      const isToday = dateStr===todayStr;
      let daynumHtml = `<div class="cal-daynum mono">${d}</div>`;
      if(coverLines.length>0){
        const color = Parser.colorForCategory(coverEvs[0].category);
        const extra = coverLines.length - 1;
        daynumHtml = `<span class="cal-daynum-cover" style="background:${color}" title="${Utils.escapeHtml(coverLines[0].text)}">
          <span class="cal-daynum mono">${d}</span>
          ${extra>0 ? `<span class="cal-span-cover-badge">+${extra}</span>` : ''}
        </span>`;
      }
      cells += `<div class="cal-cell ${hasContent?'has-content':''} ${expanded?'expanded':''} ${isToday?'is-today':''}" data-date="${dateStr}">
        ${holidayIcon ? `<div class="cal-holiday-watermark">${holidayIcon}</div>` : ''}
        <div class="cal-daynum-row">
          ${daynumHtml}
          ${fitnessRow}
        </div>
        <div class="cal-entries">${hasContent ? this.cellEntriesHtml(data, expanded, coverLines, mediaLines) : ''}</div>
      </div>`;
    }
    document.getElementById('calGrid').innerHTML = cells;
    document.querySelectorAll('#calGrid .cal-cell.has-content').forEach(el=>{
      el.addEventListener('click', ()=>{
        const d = el.dataset.date;
        if(State.expandedDays.has(d)) State.expandedDays.delete(d); else State.expandedDays.add(d);
        CalendarView.render();
      });
    });
  }
};

/* =========================================================
   9. ColumnBoard
   ========================================================= */
const ColumnBoard = {
  currentData(){ return Store.entriesByYear[State.year]; },
  render(){
    document.getElementById('colBoardTitle').textContent = String(State.year);
    document.getElementById('colBoardSub').textContent = '按年';

    const data = this.currentData();
    const emptyLine = document.getElementById('colBoardEmptyLine');
    if(!data){
      emptyLine.style.display = 'block';
      emptyLine.textContent = pickEmptyLine(String(State.year));
    } else {
      emptyLine.style.display = 'none';
    }

    const grid = document.getElementById('colBoardGrid');
    const fmtEntryDate = (e)=>{
      if(e.day) return `${pad2(e.month)}-${pad2(e.day)}`;
      if(e.month) return `${pad2(e.month)}月`;
      return '';
    };
    const cardsHtml = State.categorySlots.map(cat=>{
      const color = Parser.colorForCategory(cat);
      const items = (data && data[cat]) ? data[cat] : [];
      const itemsHtml = items.map(e=>{
        const dateLabel = fmtEntryDate(e);
        const datePart = dateLabel ? `<span class="col-item-date mono">${dateLabel}</span>` : '';
        return `<div class="col-item">${datePart}${Utils.escapeHtml(e.text)}</div>`;
      }).join('');
      const catSafe = Utils.escapeHtml(cat);
      return `<div class="col-card" data-cat="${catSafe}">
        <div class="col-card-head">
          <span class="col-card-label" data-open-menu="${catSafe}"><span class="col-dot" style="background:${color}"></span>${catSafe}</span>
        </div>
        <div class="col-items">${itemsHtml}</div>
      </div>`;
    }).join('');

    const remaining = Store.categoryOrder.filter(c=>!State.categorySlots.includes(c));
    const addCardHtml = `<div class="col-card add-card">
      <div class="add-card-label">${remaining.length ? '添加分类' : '分类都加上了'}</div>
      ${remaining.map(c=>`<div class="add-chip" data-add="${Utils.escapeHtml(c)}">${Utils.escapeHtml(c)}</div>`).join('')}
    </div>`;

    grid.innerHTML = cardsHtml + addCardHtml;
    grid.querySelectorAll('[data-open-menu]').forEach(el=>{
      el.addEventListener('click', ()=> SlotMenu.openFor(el.dataset.openMenu, el));
    });
    grid.querySelectorAll('[data-add]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const c = el.dataset.add;
        if(!State.categorySlots.includes(c)) State.categorySlots.push(c);
        ColumnBoard.render();
      });
    });
  }
};

/* =========================================================
   10. SlotMenu
   ========================================================= */
const SlotMenu = {
  openFor(cat, anchorEl){
    const menu = document.getElementById('slotMenu');
    menu.dataset.cat = cat;
    const rect = anchorEl.getBoundingClientRect();
    menu.style.left = rect.left + 'px';
    menu.style.top = (rect.bottom + 6) + 'px';
    this.renderMain();
    menu.classList.add('show');
  },
  renderMain(){
    document.getElementById('slotMenu').innerHTML = `
      <div class="slot-menu-item" data-action="open-swap">置换</div>
      <div class="slot-menu-divider"></div>
      <div class="slot-menu-item danger" data-action="delete">删除</div>`;
  },
  renderSwapList(){
    const menu = document.getElementById('slotMenu');
    const remaining = Store.categoryOrder.filter(c=>!State.categorySlots.includes(c));
    if(remaining.length===0){
      menu.innerHTML = `<div class="slot-menu-item" style="color:var(--muted); cursor:default;">分类都在栏位上了</div>`;
      return;
    }
    menu.innerHTML = remaining.map(c=>`<div class="slot-menu-item" data-action="swap-to" data-target="${Utils.escapeHtml(c)}">${Utils.escapeHtml(c)}</div>`).join('');
  },
  close(){ document.getElementById('slotMenu').classList.remove('show'); },
  handleClick(e){
    const item = e.target.closest('.slot-menu-item');
    if(!item || !item.dataset.action) return;
    const menu = document.getElementById('slotMenu');
    const cat = menu.dataset.cat;
    if(item.dataset.action==='open-swap'){ this.renderSwapList(); return; }
    if(item.dataset.action==='delete'){
      const idx = State.categorySlots.indexOf(cat);
      if(idx>-1) State.categorySlots.splice(idx,1);
    } else if(item.dataset.action==='swap-to'){
      const idx = State.categorySlots.indexOf(cat);
      if(idx>-1) State.categorySlots[idx] = item.dataset.target;
    }
    this.close();
    ColumnBoard.render();
  }
};
document.getElementById('slotMenu').addEventListener('click', e=>SlotMenu.handleClick(e));
document.addEventListener('click', e=>{
  const menu = document.getElementById('slotMenu');
  if(!menu.classList.contains('show')) return;
  if(e.target.closest('#slotMenu') || e.target.closest('[data-open-menu]')) return;
  SlotMenu.close();
});

/* =========================================================
   10.5 MediaBoard —— 读书/观影这类"媒体分类"的卡片墙，
        独立于分栏看板/SpanRail，只读Store.mediaItems。
   ========================================================= */
const MediaBoard = {
  // 去掉书名号/引号这类装饰符号，取标题第一个字当封面兜底的"缩略字"。
  initialChar(title){
    const stripped = title.replace(/^[《「『"'\s]+/, '');
    return stripped.charAt(0) || title.charAt(0) || '?';
  },
  fmtDate(d){
    if(!d) return '';
    if(d.precision==='day') return `${d.year}-${pad2(d.month)}-${pad2(d.day)}`;
    if(d.precision==='month') return `${d.year}-${pad2(d.month)}`;
    return String(d.year);
  },
  // 不带年份的版本——卡片按年份分组，组标题已经是年份了，卡片内部日期
  // 再重复一遍年份没意义；只精确到年（没写月日）的条目，去掉年份后
  // 就什么都不剩了，返回空字符串，交给dateLine决定要不要整行都不显示。
  fmtDateNoYear(d){
    if(!d) return '';
    if(d.precision==='day') return `${pad2(d.month)}-${pad2(d.day)}`;
    if(d.precision==='month') return `${d.month}月`;
    return '';
  },
  dateLine(item){
    // origin不再掺进日期行——只负责日期本身，没写日期就提示"未注明日期"，
    // origin挪到评分同一行、评分后面，见metaLine()/originHtml()。
    if(!item.start) return '未注明日期';
    // 只有起止落在同一年才省年份；跨年的条目（比如12月开始、次年1月看完）
    // 还是把完整年份留着，不然"12-01 – 01-15"会让人以为是同一年内的事。
    const sameYear = !item.end || item.end==='ongoing' || item.start.year===item.end.year;
    const fmt = d => sameYear ? this.fmtDateNoYear(d) : this.fmtDate(d);
    const s = fmt(item.start);
    const e = (item.end && item.end!=='ongoing') ? fmt(item.end) : '';
    return (!e || e===s) ? s : `${s} – ${e}`;
  },
  originHtml(origin){
    if(!origin) return '';
    return `<span class="media-card-origin">${Utils.escapeHtml(origin)}</span>`;
  },
  metaLine(item){
    const rating = this.ratingHtml(item.rating);
    const origin = this.originHtml(item.origin);
    if(!rating && !origin) return '';
    return `<div class="media-card-meta">${rating}${origin}</div>`;
  },
  rewatchLine(item){
    if(!item.rewatches || item.rewatches.length===0) return '';
    const years = [...new Set(item.rewatches.map(r=>r.year))];
    return `又看了${item.rewatches.length}次（${years.join('、')}）`;
  },
  ratingHtml(rating){
    if(!rating) return '';
    let dots = '';
    for(let i=1;i<=5;i++) dots += `<span class="media-card-dot ${i<=rating?'on':''}"></span>`;
    return `<div class="media-card-rating">${dots}</div>`;
  },
  tagsHtml(tags){
    if(!tags || tags.length===0) return '';
    const MAX = 3;
    const shown = tags.slice(0, MAX);
    const restCount = tags.length - MAX;
    let html = shown.map(t=>`<span class="media-card-tag">${Utils.escapeHtml(t)}</span>`).join('');
    if(restCount>0) html += `<span class="media-card-tag">+${restCount}</span>`;
    return `<div class="media-card-tags">${html}</div>`;
  },
  cardHtml(item){
    const color = Parser.colorForCategory(item.category);
    const cover = item.coverUrl
      ? `<img class="media-cover" src="${Utils.escapeHtml(item.coverUrl)}" alt="" loading="lazy"
          onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'media-cover-fallback',style:'background:${color}',textContent:'${Utils.escapeHtml(this.initialChar(item.title))}'}))">`
      : `<div class="media-cover-fallback" style="background:${color}">${Utils.escapeHtml(this.initialChar(item.title))}</div>`;
    const rewatch = this.rewatchLine(item);
    const dateLineText = this.dateLine(item);
    return `<div class="media-card">
      ${cover}
      <div class="media-card-body">
        <div class="media-card-title">${Utils.escapeHtml(item.title)}</div>
        ${dateLineText ? `<div class="media-card-date">${Utils.escapeHtml(dateLineText)}</div>` : ''}
        ${this.metaLine(item)}
        ${rewatch ? `<div class="media-card-rewatch">${Utils.escapeHtml(rewatch)}</div>` : ''}
        ${this.tagsHtml(item.tags)}
      </div>
    </div>`;
  },
  // 分组年份取"第一次"的年份（主date的start）——没写date的条目统一归到
  // "未注明年份"，排在最前面，不跟着排序方向跑来跑去。
  groupByYear(items){
    const groups = {};
    items.forEach(it=>{
      const key = it.start ? it.start.year : '未注明年份';
      (groups[key] = groups[key]||[]).push(it);
    });
    Object.values(groups).forEach(list=>{
      list.sort((a,b)=>{
        const da = a.start ? dateObjToJSDate(a.start,false) : 0;
        const db = b.start ? dateObjToJSDate(b.start,false) : 0;
        return da - db;
      });
    });
    return groups;
  },
  render(){
    const items = Store.mediaItems || [];
    const chipsEl = document.getElementById('mediaChips');
    const cats = Store.mediaCategories || [];
    chipsEl.innerHTML = ['<div class="media-chip ' + (State.mediaFilter==='all'?'active':'') + '" data-filter="all">全部</div>']
      .concat(cats.map(c=>`<div class="media-chip ${State.mediaFilter===c?'active':''}" data-filter="${Utils.escapeHtml(c)}">${Utils.escapeHtml(c)}</div>`))
      .join('');
    chipsEl.querySelectorAll('[data-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{ State.mediaFilter = el.dataset.filter; this.render(); });
    });

    // 地区chip是动态生成的——只列出实际出现过的origin值，一条都没有就把
    // 这整行藏起来（不显示一个只有"全部"、点了也没意义的空筛选行）。
    const origins = [...new Set(items.map(it=>it.origin).filter(Boolean))].sort();
    const originRow = document.getElementById('mediaOriginRow');
    if(origins.length===0){
      originRow.style.display = 'none';
    } else {
      originRow.style.display = 'flex';
      const originChipsEl = document.getElementById('mediaOriginChips');
      originChipsEl.innerHTML = ['<div class="media-chip ' + (State.mediaOriginFilter==='all'?'active':'') + '" data-origin-filter="all">全部</div>']
        .concat(origins.map(o=>`<div class="media-chip ${State.mediaOriginFilter===o?'active':''}" data-origin-filter="${Utils.escapeHtml(o)}">${Utils.escapeHtml(o)}</div>`))
        .join('');
      originChipsEl.querySelectorAll('[data-origin-filter]').forEach(el=>{
        el.addEventListener('click', ()=>{ State.mediaOriginFilter = el.dataset.originFilter; this.render(); });
      });
    }

    const sortBtn = document.getElementById('mediaSortBtn');
    sortBtn.textContent = State.mediaSortDesc ? '新 → 旧' : '旧 → 新';
    sortBtn.onclick = ()=>{ State.mediaSortDesc = !State.mediaSortDesc; this.render(); };

    // 类型（category）和地区（origin）是两个各自独立的筛选维度，同时生效时
    // 取交集——比如"电影"+"日本"就是"日本电影"，而不是两者的并集。
    let filtered = State.mediaFilter==='all' ? items : items.filter(it=>it.category===State.mediaFilter);
    if(State.mediaOriginFilter!=='all') filtered = filtered.filter(it=>it.origin===State.mediaOriginFilter);
    const emptyLine = document.getElementById('mediaEmptyLine');
    const wrap = document.getElementById('mediaYearGroups');
    if(filtered.length===0){
      emptyLine.style.display = 'block';
      emptyLine.textContent = cats.length===0
        ? '还没有登记任何「媒体分类」，去 category-registry 笔记加一个吧。'
        : pickEmptyLine('media-' + State.mediaFilter + '-' + State.mediaOriginFilter);
      wrap.innerHTML = '';
      return;
    }
    emptyLine.style.display = 'none';

    const groups = this.groupByYear(filtered);
    let years = Object.keys(groups);
    years.sort((a,b)=>{
      if(a==='未注明年份') return -1;
      if(b==='未注明年份') return 1;
      return State.mediaSortDesc ? (b-a) : (a-b);
    });

    wrap.innerHTML = years.map(y=>{
      const list = groups[y];
      return `<div class="media-year-group">
        <div class="media-year-head display">${y} <span class="media-year-count">${list.length}条</span></div>
        <div class="media-grid">${list.map(it=>this.cardHtml(it)).join('')}</div>
      </div>`;
    }).join('');
  }
};

/* =========================================================
   10.6 HorizontalTimeline —— "横向条目栏位"里登记的分类，
        一行一个分类摊在同一条年度时间轴上，横向对比不同类别的分布。
   ========================================================= */
const HorizontalTimeline = {
  yearRatio(jsDate, year){
    const start = new Date(year, 0, 1).getTime();
    const end = new Date(year, 11, 31, 23, 59, 59).getTime();
    return Math.min(Math.max((jsDate.getTime()-start)/(end-start), 0), 1);
  },
  // 汇总某个分类在某一年要显示的条目——三个数据源分别对应：跨度事件
  // （旅游/居住/工作这类start~end的）、单点日期条目（entriesByYear里已经
  // 按年份/分类分好的，含daily note打的标签和「## 时间线」的点日期）、
  // 媒体条目（读书/观影这类，只取day精度能定位的，跟日历cover同一条规则）。
  // 三者在数据模型里本来就是互斥的（一条笔记只会落进其中一种管线），
  // 这里只是分别读出来拼成同一种{title,start,end}形状。
  rowItemsForCategory(cat, year){
    const items = [];
    // 跨度笔记自己「## 时间线」里的明细，已经打包进spanEvent.timelineItems了
    // （用来给日历cover挑当天该显示哪句话），这里先记一下这些明细的"年-月-日-
    // 文字"指纹，待会儿从entriesByYear的点日期里把它们排除掉——不然同一条
    // 笔记会又画一条横条、又在横条覆盖的那几天各自多画一个点，重复表达。
    const spanTimelineKeys = new Set();
    (Store.spanEvents||[]).forEach(ev=>{
      if(ev.category!==cat) return;
      const endD = ev.end==='ongoing'
        ? {year:NOW.getFullYear(), month:NOW.getMonth()+1, day:NOW.getDate(), precision:'day'}
        : ev.end;
      if(year>=ev.start.year && year<=endD.year) items.push({title:ev.title, start:ev.start, end:endD});
      (ev.timelineItems||[]).forEach(it=>{
        if(it.day) spanTimelineKeys.add(`${it.year}-${it.month}-${it.day}-${it.text}`);
      });
    });
    ((Store.entriesByYear[year]||{})[cat]||[]).forEach(e=>{
      if(!e.month) return; // 完全没日期精度的条目，时间轴上画不出位置，跳过
      if(e.day && spanTimelineKeys.has(`${year}-${e.month}-${e.day}-${e.text}`)) return;
      const d = {year, month:e.month, day:e.day||1, precision: e.day?'day':'month'};
      items.push({title:e.text, start:d, end:d});
    });
    (Store.mediaItems||[]).forEach(it=>{
      if(it.category!==cat || !it.start) return;
      const endD = (it.end && it.end!=='ongoing') ? it.end : it.start;
      if(year>=it.start.year && year<=endD.year) items.push({title:it.title, start:it.start, end:endD});
    });
    return items;
  },
  // 简单的行内避让——同一分类这一年如果好几条时间上有重叠，拆到第2、第3……
  // 子行摆开，不做拖拽/改色这些交互，先保证基本能看清楚不糊在一起。
  packRows(items){
    const withJs = items.map(it=>({
      ...it, jsStart: dateObjToJSDate(it.start, false), jsEnd: dateObjToJSDate(it.end, true)
    })).sort((a,b)=>a.jsStart-b.jsStart);
    const rows = [];
    withJs.forEach(it=>{
      let placed = -1;
      for(let r=0;r<rows.length;r++){
        if(it.jsStart > rows[r].lastEnd){ placed=r; break; }
      }
      if(placed===-1){ rows.push({lastEnd:it.jsEnd}); placed = rows.length-1; }
      else rows[placed].lastEnd = it.jsEnd;
      it.rowIndex = placed;
    });
    return { items: withJs, rowCount: rows.length || 1 };
  },
  rowHtml(cat, year){
    const color = Parser.colorForCategory(cat);
    const raw = this.rowItemsForCategory(cat, year);
    const label = `<div class="tl-row-label" title="${Utils.escapeHtml(cat)}"><span class="tl-row-dot" style="background:${color}"></span>${Utils.escapeHtml(cat)}</div>`;
    const PAD = 10, BAR_H = 22, GAP = 10, DOT_W = 5;
    if(raw.length===0){
      return `<div class="tl-row">${label}<div class="tl-track" style="height:${BAR_H+PAD*2}px;"><div class="tl-track-empty">这一年没有记录</div></div></div>`;
    }
    const { items, rowCount } = this.packRows(raw);
    let inner = '';
    items.forEach(it=>{
      const leftR = this.yearRatio(it.jsStart, year);
      // 结束日期往后推一天再算比例，让横条视觉上盖到"结束当天"整天，
      // 不是画到结束日的凌晨0点看起来像少了一天。
      const endExclusive = new Date(it.jsEnd.getFullYear(), it.jsEnd.getMonth(), it.jsEnd.getDate()+1);
      const rightR = this.yearRatio(endExclusive, year);
      // 每个子行的"带状区域"从PAD开始往下数，条/点都以这个带状区域的
      // 垂直中点为准居中摆放——absolute定位的元素量的是.tl-track的边框盒，
      // 不会自动吃到父级的padding，所以上下留白得靠这里的PAD常量手动加上去，
      // 不能指望CSS padding顶开。
      const bandTop = PAD + it.rowIndex*(BAR_H+GAP);
      const tip = Utils.escapeHtml(it.title);
      const isSameDay = it.jsStart.getTime()===it.jsEnd.getTime();
      if(isSameDay){
        const dotLeft = ((leftR+rightR)/2)*100;
        inner += `<div class="tl-dot" style="left:${dotLeft}%;top:${bandTop}px;width:${DOT_W}px;height:${BAR_H}px;margin-left:${-DOT_W/2}px;background:${color}" title="${tip}"></div>`;
      } else {
        const left = leftR*100;
        const width = Math.max((rightR-leftR)*100, 0.4);
        inner += `<div class="tl-bar" style="left:${left}%;width:${width}%;top:${bandTop}px;height:${BAR_H}px;background:${color}2E" title="${tip}"><span class="tl-bar-label">${tip}</span></div>`;
      }
    });
    const trackHeight = PAD*2 + rowCount*BAR_H + Math.max(rowCount-1,0)*GAP;
    return `<div class="tl-row">${label}<div class="tl-track" style="height:${trackHeight}px;">${inner}</div></div>`;
  },
  render(){
    const year = State.timelineYear || NOW.getFullYear();
    document.getElementById('tlYearLabel').textContent = year + '年';
    document.getElementById('tlPrevYear').onclick = ()=>{ State.timelineYear = year - 1; this.render(); };
    document.getElementById('tlNextYear').onclick = ()=>{ State.timelineYear = year + 1; this.render(); };
    const cats = Store.horizontalRowCategories || [];
    document.getElementById('tlAxis').innerHTML = Array.from({length:12}, (_,i)=>`<div class="tl-axis-tick">${i+1}月</div>`).join('');
    const wrap = document.getElementById('tlRows');
    if(cats.length===0){
      wrap.innerHTML = `<div class="media-empty-line">还没有登记任何「横向条目栏位」，去 category-registry 笔记加一个吧。</div>`;
      return;
    }
    wrap.innerHTML = cats.map(c=>this.rowHtml(c, year)).join('');
  }
};

/* =========================================================
   11. Warnings 展示
   ========================================================= */
function renderWarnings(){
  const el = document.getElementById('warnStrip');
  if(Store.warnings.length){
    el.style.display = 'block';
    el.textContent = `⚠ ${Store.warnings.length} 条笔记有数据问题（悬停查看详情，不影响其余正常内容显示）`;
    el.title = Store.warnings.join('\n');
  } else {
    el.style.display = 'none';
  }
}

/* =========================================================
   12. 年份滑块 + 主渲染
   ========================================================= */
function renderAll(){
  document.getElementById('panel-map').classList.toggle('active', State.tab==='map');
  document.getElementById('panel-columns').classList.toggle('active', State.tab==='columns');
  document.getElementById('panel-media').classList.toggle('active', State.tab==='media');
  document.getElementById('panel-timeline').classList.toggle('active', State.tab==='timeline');
  document.getElementById('granSwitch').classList.toggle('show', State.tab==='columns');
  document.getElementById('dateNav').classList.toggle('show', State.tab==='columns');
  renderWarnings();

  if(State.tab==='map'){ MapView.render(); return; }
  if(State.tab==='media'){ MediaBoard.render(); return; }
  if(State.tab==='timeline'){ HorizontalTimeline.render(); return; }

  document.getElementById('monthLabel').classList.toggle('show', State.gran==='month');
  document.getElementById('monthLabel').textContent = State.month + '月';
  document.getElementById('yearInput').value = State.year;

  SpanRail.render();
  document.getElementById('yearBoardWrap').style.display = State.gran==='year' ? 'block':'none';
  document.getElementById('calCard').style.display = State.gran==='month' ? 'block':'none';
  if(State.gran==='year') ColumnBoard.render(); else CalendarView.render();
}

document.querySelector('.tabs-main').addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if(!tab) return;
  State.tab = tab.dataset.tab;
  [...document.querySelectorAll('.tabs-main .tab')].forEach(t=>t.classList.toggle('active', t===tab));
  renderAll();
});
document.getElementById('granSwitch').addEventListener('click', e=>{
  const tab = e.target.closest('.gran-tab'); if(!tab) return;
  State.gran = tab.dataset.gran;
  [...document.querySelectorAll('#granSwitch .gran-tab')].forEach(t=>t.classList.toggle('active', t===tab));
  renderAll();
});
document.getElementById('yearInput').addEventListener('change', e=>{
  State.year = Math.min(State.yearMax, Math.max(State.yearMin, Number(e.target.value)||State.year));
  renderAll();
});
/* 月份进退位：跨年了就顺带把年份也进/退一位，月份步进箭头和滚轮共用这一份逻辑 */
function stepMonth(delta){
  let m = State.month + delta;
  let y = State.year;
  if(m<1){ m=12; y--; } else if(m>12){ m=1; y++; }
  State.month = m; State.year = Math.min(State.yearMax, Math.max(State.yearMin, y));
}
/* 年/月导航条：‹›箭头按当前粒度走（年Tab滚年，月Tab滚月+跨年进退位）；
   "今天"一键跳回当前年月——个人生平特有的锚点，History没有这个概念。 */
document.getElementById('dateNav').addEventListener('click', e=>{
  const arrow = e.target.closest('.date-nav-arrow');
  if(arrow){
    const dir = Number(arrow.dataset.dir);
    if(State.gran==='month') stepMonth(dir);
    else State.year = Math.min(State.yearMax, Math.max(State.yearMin, State.year + dir));
    renderAll();
    return;
  }
  if(e.target.closest('#todayBtn')){
    State.year = NOW.getFullYear();
    State.month = NOW.getMonth()+1;
    renderAll();
  }
});
document.getElementById('dateNav').addEventListener('wheel', e=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? 1 : -1;
  // 月Tab下滚轮滚的是月份（带年份进位/退位），年Tab下才滚年份——
  // 跟月份步进箭头共用同一套进退位逻辑（stepMonth）。
  if(State.gran==='month'){
    stepMonth(delta);
  } else {
    const y = Math.min(Math.max(State.year + delta, State.yearMin), State.yearMax);
    if(y === State.year) return;
    State.year = y;
  }
  renderAll();
}, { passive:false });

/* =========================================================
   13. 选择 Obsidian 文件夹（真实数据源，浏览器支持才可用）
   ---------------------------------------------------------
   跟 history-dashboard.html 同一套"记住文件夹"逻辑：选过一次之后，
   下次打开只要浏览器还认这个句柄的读权限，就直接自动读，不用重新弹
   选文件夹对话框；权限过期了（比如换了个浏览器session），也只弹一个
   "点一下确认权限"，不是重新选一遍文件夹。
   ========================================================= */
const connectBtn = document.getElementById('connectBtn');
const connTextEl = document.getElementById('connText');
let pendingRestoreHandle = null;

function setConnected(on){
  document.getElementById('connDot').classList.toggle('on', on);
  connTextEl.textContent = on ? '已连接' : '未连接';
  connTextEl.title = on ? '已连接' : '未连接仓库';
  connectBtn.title = on ? '重新选择' : '选择 Obsidian 文件夹';
}

async function connectVault(dirHandle){
  connTextEl.textContent = '读取中…';
  const files = await Parser.scanVaultFiles(dirHandle);
  deriveStore(Parser.buildStore(files));
  State.categorySlots = Store.categoryOrder.slice();
  setConnected(true);
  renderAll();
}

if(!('showDirectoryPicker' in window)){
  connectBtn.disabled = true;
  connTextEl.textContent = '不支持';
  connTextEl.title = '此浏览器不支持本地文件读取，请用 Chrome/Edge 打开';
} else {
  connectBtn.addEventListener('click', async ()=>{
    try{
      // 有存过的句柄、只是权限过期：只弹权限确认，不再弹选文件夹对话框
      if(pendingRestoreHandle){
        const p = await pendingRestoreHandle.requestPermission({mode:'read'});
        if(p==='granted'){ await connectVault(pendingRestoreHandle); pendingRestoreHandle = null; }
        return;
      }
      // 真正第一次连接 / 手动点"重新选择"：才弹原生选文件夹对话框
      const dirHandle = await window.showDirectoryPicker();
      await Db.set('vaultHandle', dirHandle);
      pendingRestoreHandle = null;
      await connectVault(dirHandle);
    } catch(e){
      if(e.name !== 'AbortError') console.error(e);
    }
  });

  (async function tryRestore(){
    try{
      const handle = await Db.get('vaultHandle');
      if(!handle) return;
      const perm = await handle.queryPermission({mode:'read'});
      if(perm === 'granted'){ await connectVault(handle); }
      else{
        pendingRestoreHandle = handle;
        connTextEl.textContent = '待重连';
        connTextEl.title = '点右侧图标重新确认读取权限';
      }
    }catch(e){
      console.warn('恢复上次连接的 vault 失败：', e);
    }
  })();
}

renderAll();
</script>
</body>
</html>
