<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F2E9;
    --surface: #FFFFFF;
    --surface-2: #F0EBDD;
    --ink: #1F2430;
    --ink-soft: #4A4638;
    --muted: #8A8577;
    --line: #E3DDCD;
    --accent: #B5502E;
    --accent-soft: #E8CFC0;
    --danger: #A23B2E;
    --visited: #1F2430;
    --unvisited: #E3DDCD;
    --accent-deep: #8A3A22;   /* accent的加深版：目前只有下钻后国家fill用 */
    --on-color: #FFFFFF;      /* 压在强饱和度色块上（accent/分类色/封面兜底色）的浅色文字 */
    --status-on: #3E8E5A;     /* 连接状态点：已连接 */
    --status-off: #C0392B;    /* 连接状态点：未连接（也是.dot默认色） */
    --warn-text: #8A5A2E;     /* warn-strip警告条：文字 */
    --warn-bg: #F4E8D6;       /* warn-strip警告条：底色 */
    --warn-border: #E4CFA6;   /* warn-strip警告条：描边 */
    --radius: 14px;
    --radius-pill: 999px;     /* 全站药丸形状（tab/chip/徽标等）统一走这个变量 */
    --shadow: 0 1px 2px rgba(31,36,48,.06), 0 8px 24px rgba(31,36,48,.05);
    /* 字号规范：跟history-dashboard.html同一套8档分级，全文所有font-size都引用这里 */
    --fs-display: 46px;  /* 页面级超大数字：年份 */
    --fs-xl:      22px;  /* 一级标题：品牌名/大标题 */
    --fs-lg:      18px;  /* 二级标题：空状态大字、月份步进器 */
    --fs-md:      16px;  /* 三级标题：卡片/分栏标题 */
    --fs-base:    15px;  /* 四级标题：导航tab */
    --fs-body:    13px;  /* 正文：条目文字、按钮 */
    --fs-sm:      12px;  /* 小字：标签徽标、次要信息 */
    --fs-xs:      11px;  /* 极小字：日期戳、坐标轴刻度 */
    --fs-micro:   9px;   /* 日历格子内嵌文字，物理空间受限 */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ scrollbar-gutter: stable; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:var(--fs-body);
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  .app{ width:min(97vw, 2400px); margin:0 auto; padding:22px 32px 40px; position:relative; }
  /* 贴主内容区右边缘探出去的小竖排——重新连接状态灯+按钮，照抄
     history-dashboard.html的.conn-rail那一套，不占.tabs这行的位置。 */
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--status-off); display:inline-block; }
  .dot.on{ background:var(--status-on); }
  .conn-rail{ position:absolute; top:0; right:-24px; z-index:5; }
  .conn-rail-status{
    position:absolute; top:32px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .conn-rail-text{ font-size:var(--fs-xs); color:var(--ink-soft); white-space:nowrap; }
  .conn-rail-icon-btn{
    position:absolute; top:76px; left:50%; transform:translateX(-50%);
    cursor:pointer; width:28px; height:28px; padding:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    transition:.15s ease;
  }
  .conn-rail-icon-btn:hover{ border-color:var(--ink-soft); }
  .conn-rail-icon-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .conn-rail-icon-btn svg{ stroke:var(--ink); }
  .conn-rail-icon-btn[disabled]{ opacity:.5; cursor:not-allowed; }

  /* ---------- 顶层导航 ---------- */
  .tabs{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs-main{ display:flex; gap:6px; align-items:center; }
  .tab{
    font-family:'Fraunces',serif; font-size:var(--fs-base); font-weight:500; cursor:pointer;
    padding:9px 20px; border-radius:var(--radius-pill); border:1px solid transparent; color:var(--muted);
  }
  .tab.active{ background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow); }

  .tabs-right{ display:flex; align-items:center; gap:10px; }
  .fitness-link{ font-size:var(--fs-xs); color:var(--ink-soft); text-decoration:none; padding:6px 12px; border:1px solid var(--line); border-radius:var(--radius-pill); white-space:nowrap; }
  .fitness-link:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .source-btn{
    font-size:var(--fs-xs); padding:8px 14px; border-radius:var(--radius-pill); border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer; box-shadow:var(--shadow);
  }
  .source-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .source-btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .warn-strip{
    font-size:var(--fs-sm); color:var(--warn-text); background:var(--warn-bg); border:1px solid var(--warn-border);
    padding:8px 14px; border-radius:10px; margin-bottom:16px; display:none; font-family:'IBM Plex Mono',monospace;
  }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .gran-switch{ display:none; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-pill); padding:4px; box-shadow:var(--shadow); }
  .gran-switch.show{ display:inline-flex; }
  .gran-tab{ padding:7px 15px; border-radius:var(--radius-pill); font-size:var(--fs-xs); font-weight:500; cursor:pointer; color:var(--ink-soft); user-select:none; }
  .gran-tab.active{ background:var(--accent); color:var(--on-color); }

  .date-nav{ display:none; align-items:center; gap:4px; }
  .date-nav.show{ display:flex; }
  .date-nav-arrow{
    font-size:var(--fs-xl); line-height:1; padding:2px 8px; cursor:pointer; color:var(--ink-soft);
    border-radius:6px; user-select:none; border:none; background:transparent; appearance:none;
    font-family:inherit;
  }
  .date-nav-arrow:hover{ background:var(--surface); color:var(--ink); }
  /* 年月导航的"标题"处理——年份是主角，用跟品牌/主Tab同一族的Fraunces衬线体、
     加粗、跟"地图看板"这些主Tab字号看齐但更大一档（fs-xl）；月份是配角，
     同字体但更轻的字重、更小一档、颜色也淡一点，形成主次关系，而不是
     两个数字一样权重地并排放。 */
  .date-nav-label{ font-family:'Fraunces',serif; font-size:var(--fs-xl); font-weight:600; color:var(--ink); display:flex; align-items:center; }
  .date-nav-year{
    font-family:'Fraunces',serif; font-size:var(--fs-xl); font-weight:600;
    border:none; background:transparent; color:var(--ink); width:4.2ch; padding:0;
    text-align:right; -moz-appearance:textfield;
  }
  .date-nav-year::-webkit-outer-spin-button, .date-nav-year::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .date-nav-year:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .date-nav-month{ display:none; margin-left:4px; font-size:var(--fs-lg); font-weight:500; color:var(--ink-soft); }
  .date-nav-month.show{ display:inline; }
  .date-nav-today{
    font-size:var(--fs-xs); padding:11px 15px; margin-left:8px; border-radius:var(--radius-pill);
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
    appearance:none; font-family:inherit;
  }
  .date-nav-today:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .map-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; position:relative; }
  .map-stage{ aspect-ratio: 1000 / 420; position:relative; }
  .map-card svg{ width:100%; height:100%; display:block; }
  .country-path{ fill:var(--unvisited); stroke:var(--bg); stroke-width:.6; cursor:default; transition:fill .15s ease; }
  .country-path.visited{ fill:var(--visited); cursor:pointer; }
  .country-path.visited.drillable{ fill:var(--accent); }
  .country-path.visited:hover{ fill:var(--ink-soft); }
  .country-path.drilled{ fill:var(--accent-deep); }

  .drill-panel{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:none; }
  .drill-panel.show{ display:block; }
  .drill-title{ font-family:'Fraunces',serif; font-size:var(--fs-lg); font-weight:600; margin-bottom:2px; }
  .drill-note{ font-size:var(--fs-xs); color:var(--muted); margin-bottom:12px; }
  .drill-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px; }
  .drill-cell{ padding:11px 8px; border-radius:10px; text-align:center; font-size:var(--fs-xs); background:var(--unvisited); color:var(--muted); border:1px solid var(--line); }
  .drill-cell.visited{ background:var(--visited); color:var(--bg); border-color:var(--visited); }
  /* 有真实轮廓数据的国家（目前是日本、中国）点开后，大地图原地从世界地图换成
     该国轮廓（同一个#mapSvg，只是换viewBox和内容），文字列表还留在下面；
     没有地图数据的国家（英国等占位阶段）大地图不换，行为跟以前一样。 */
  .map-back-btn{ position:absolute; top:16px; left:16px; z-index:2; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-pill); padding:6px 14px; font-size:var(--fs-xs); color:var(--ink); cursor:pointer; box-shadow:var(--shadow); }
  .map-back-btn:hover{ border-color:var(--ink-soft); }
  .pref-path{ fill:var(--unvisited); stroke:var(--bg); stroke-width:1.5; cursor:default; }
  .pref-path.visited{ fill:var(--visited); }
  .pref-path:hover{ fill:var(--accent-soft); }
  .pref-path.visited:hover{ fill:var(--visited); opacity:0.8; }
  .map-tooltip{ position:absolute; pointer-events:none; z-index:5; background:var(--ink); color:var(--bg); font-size:var(--fs-xs); padding:4px 9px; border-radius:6px; white-space:nowrap; transform:translate(-50%, -130%); }

  .span-rail{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-bottom:16px; align-items:start; }
  .rail-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
  .rail-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .rail-row:last-child{ margin-bottom:0; }
  .rail-row-label{
    font-size:var(--fs-sm); font-weight:600; color:var(--ink); flex:none;
    width:84px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rail-multi-track{ flex:1; display:flex; align-items:center; gap:8px; }
  .rail-multi-track .rail-track{ flex:1; }
  .rail-empty-text{ font-size:var(--fs-sm); color:var(--muted); height:27px; display:flex; align-items:center; }
  .rail-track{
    position:relative; flex:1; height:27px; border-radius:7px;
    display:flex; align-items:center; padding:0 10px; overflow:visible;
  }
  .rail-name{
    position:relative; z-index:1; font-size:var(--fs-sm); font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* "## 阶段"细分色块——铺在rail-track底色之上、rail-name文字之下（z-index
     比文字低），左右两端留一点点圆角，不然在圆角轨道里贴着边会露出方角。 */
  .rail-stage{ position:absolute; top:0; bottom:0; z-index:0; border-radius:2px; }
  .rail-marker{
    position:absolute; top:-4px; bottom:-4px; width:6px; border-radius:3px;
    transform:translateX(-50%); border:2px solid var(--surface); filter:brightness(.85) saturate(1.05);
  }

  .cal-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
  /* 这一行原来靠justify-content:space-between撑开左右两块，但calHeadLine
     大多数时候是display:none（只有"这个月是空的"才显示），可见的flex子元素
     就只剩一个，space-between在只有一个子元素时不会把它推到最右——这才是
     "右对齐一直没生效、始终贴在左边"这个bug的真正原因。改成右侧集群自己
     margin-left:auto，不管左边有没有可见内容，右侧集群永远贴住最右边，
     不依赖"左右两边各有内容"这个前提。 */
  .cal-tag-row{ display:flex; align-items:center; gap:12px; min-height:28px; margin-bottom:14px; flex-wrap:wrap; }
  .cal-tag-row-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .cal-tag-row-right{ display:flex; align-items:center; gap:14px; margin-left:auto; flex:none; }
  .cal-fitness-summary{ font-size:var(--fs-xs); color:var(--muted); white-space:nowrap; }
  .cal-tag-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .cal-tag-chip{ display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--surface); font-size:var(--fs-xs); cursor:pointer; color:var(--ink); }
  .cal-tag-chip:hover{ border-color:var(--ink-soft); }
  .cal-tag-chip.inactive{ color:var(--muted); opacity:0.45; }
  .cal-tag-chip-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .cal-head-line{ font-size:var(--fs-sm); color:var(--muted); font-style:italic; }
  .cal-unplaced{ background:var(--surface-2); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .cal-unplaced-label{ font-size:var(--fs-micro); color:var(--muted); margin-bottom:6px; }
  .cal-unplaced-line{ font-size:var(--fs-sm); display:flex; align-items:flex-start; gap:6px; padding:2px 0; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(144px, auto); gap:6px; align-items:stretch; }
  .cal-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-weekday{ text-align:center; font-size:var(--fs-xs); font-weight:600; letter-spacing:.02em; color:var(--ink-soft); background:var(--surface-2); border-radius:8px; padding:6px 0; }
  .cal-weekday:nth-child(6), .cal-weekday:nth-child(7){ color:var(--accent); }
  .cal-cell{ position:relative; z-index:0; border-radius:9px; border:1px solid var(--line); background:var(--bg); padding:6px 7px; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  /* 节日水印——圣诞/生日这类固定公历月日、春节这类查表得出公历日期的节日，
     命中的当天格子正中央浮一个大图标当水印。position:absolute+z-index:-1
     让它压在.cal-cell自己的背景之上、但在日期数字/fitness/正文这些正常
     文档流内容之下（z-index:-1只影响同一层叠上下文里"负值"这一档的绘制顺序，
     不会跑到.cal-cell背景色的下面去），pointer-events:none保证不挡点击
     展开格子。 */
  .cal-holiday-watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:48px; line-height:1; opacity:.32; z-index:-1; pointer-events:none; }
  .cal-grid .cal-cell:nth-child(7n+6):not(.blank),
  .cal-grid .cal-cell:nth-child(7n):not(.blank){ background:var(--surface-2); }
  .cal-cell.blank{ visibility:hidden; border:none; background:transparent; }
  .cal-cell.has-content{ cursor:pointer; }
  .cal-cell.has-content:hover{ border-color:var(--ink-soft); }
  .cal-cell.is-today{ border-color:var(--danger); }
  .cal-cell.is-today:hover{ border-color:var(--danger); }
  .cal-daynum{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-xs); color:var(--muted); flex:none; }
  /* 跨度事件（旅游/出差这类，登记在「日历跨度分类」里）盖住日期数字的色块——
     用inline-flex包住数字本身而不是绝对定位叠加，尺寸自然跟着数字走，不用
     手动对齐像素。多条命中时只显示第一条的颜色，其余用角标"+N"提示还有更多，
     不在格子里堆叠展示（点开格子展开详情能看到全部文字）。 */
  .cal-daynum-cover{ display:inline-flex; align-items:center; gap:4px; align-self:flex-start; padding:1px 6px; border-radius:6px; }
  .cal-daynum-cover .cal-daynum{ color:var(--on-color); }
  .cal-span-cover-badge{ font-size:var(--fs-micro); color:var(--on-color); opacity:0.85; font-family:'Inter',sans-serif; }
  /* 日期数字这一行——日期数字 + Fitness当天记录，并排显示在格子第一行，
     不受展开/折叠影响（跟cal-entries那套"折叠只显示3行+更多"是两回事）。
     日期数字宽度不固定（1位数比2位数窄），Fitness内容的起始位置会跟着数字
     宽度自然浮动，只保证跟数字之间有固定6px的gap——试过强制固定数字宽度
     让起始位置完全对齐，但单数字那天gap显得过宽不协调，改回这种自然宽度。 */
  .cal-daynum-row{ display:flex; align-items:center; gap:6px; }
  .cal-fitness-row{ display:flex; gap:3px; flex:1; min-width:0; }
  .cal-fitness-chip{ font-size:var(--fs-xs); font-weight:600; padding:2px 5px; border-radius:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .cal-entries{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .cal-cell:not(.expanded) .cal-entries{ max-height:84px; }
  .cal-entry-line{ font-size:var(--fs-xs); line-height:15px; display:flex; align-items:flex-start; gap:4px; }
  .cal-cell:not(.expanded) .cal-entry-line{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-entry-dot{ width:6px; height:6px; border-radius:50%; flex:none; margin-top:4px; }
  .cal-more{ font-size:var(--fs-micro); color:var(--muted); }

  .col-board-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .col-board-head .display{ font-size:var(--fs-xl); font-weight:600; }
  .col-board-head .sub{ font-size:var(--fs-xs); color:var(--muted); }
  .col-board-empty-line{ font-size:var(--fs-sm); color:var(--muted); font-style:italic; margin-bottom:10px; }
  .col-board-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; align-items:start; }
  .col-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; min-height:120px; }
  .col-card-head{ margin-bottom:9px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .col-card-label{ font-size:var(--fs-sm); font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer; padding:3px 6px; margin:-3px -6px; border-radius:6px; }
  .col-card-label:hover{ background:var(--surface-2); }
  .col-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .col-items{ display:flex; flex-direction:column; gap:5px; }
  .col-item{ font-size:var(--fs-body); line-height:1.5; }
  .col-item-date{ font-size:var(--fs-xs); color:var(--muted); margin-right:6px; }
  .col-card.add-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--line); box-shadow:none; background:transparent; }
  .add-chip{ padding:6px 13px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--surface); font-size:var(--fs-xs); cursor:pointer; color:var(--ink-soft); }
  .add-chip:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .add-card-label{ font-size:var(--fs-xs); color:var(--muted); }

  .slot-menu{
    display:none; position:fixed; z-index:999; min-width:132px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:6px;
  }
  .slot-menu.show{ display:block; }
  .slot-menu-item{ font-size:var(--fs-body); padding:7px 10px; border-radius:6px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
  .slot-menu-item:hover{ background:var(--surface-2); color:var(--ink); }
  .slot-menu-item.danger{ color:var(--danger); }
  .slot-menu-item.danger:hover{ background:var(--surface-2); }
  .slot-menu-divider{ height:1px; background:var(--line); margin:5px 2px; }

  /* ---------- 媒体看板（卡片墙） ---------- */

     行间距）必须靠JS算出的top值本身撑开，不能指望CSS padding顶开。 */

  .tl-bar{ position:absolute; border-radius:7px; display:flex; align-items:center; padding:0 8px; overflow:hidden; white-space:nowrap; cursor:default; border:1px solid transparent; transition:border-color .12s; }

/* =========================================================
   0. Db —— IndexedDB：记住上次选过的 vault 文件夹句柄
      （跟 history-dashboard.html 的 Db 模块同一份实现，换了个库名
      避免两个工具要是哪天同源打开，互相把对方存的句柄覆盖掉）
   ========================================================= */
const Db = {
  NAME: 'cairn-db',
  STORE: 'handles',
  open(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(Db.NAME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(Db.STORE);
      req.onsuccess = ()=> res(req.result);
      req.onerror = ()=> rej(req.error);
    });
  },
  async set(key, val){
    const db = await Db.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(Db.STORE, 'readwrite');
      tx.objectStore(Db.STORE).put(val, key);
      tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
    });
  },
  async get(key){
    const db = await Db.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(Db.STORE, 'readonly');
      const req = tx.objectStore(Db.STORE).get(key);
      req.onsuccess = ()=>res(req.result); req.onerror = ()=>rej(req.error);
    });
  }
};

const Parser = {

  // ColumnBoard/SpanRail那边因为只认registeredCategories，天然不会捡到它。
  UNTAGGED_KEY: '__untagged__',
  cleanVal(v){
    v = (v||'').trim();
    if((v.startsWith('"')&&v.endsWith('"')) || (v.startsWith("'")&&v.endsWith("'"))) v = v.slice(1,-1).trim();
    return v;

  parseNote(text){
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if(!m) return {fm:{}, body:text};
    const lines = m[1].split(/\r?\n/);
    const fm = {}; let curKey=null;
    for(const line of lines){
      const listMatch = line.match(/^\s+[-*]\s+(.*)$/) || line.match(/^[-*]\s+(.*)$/);
      if(listMatch && curKey){
        if(!Array.isArray(fm[curKey])) fm[curKey] = fm[curKey] ? [fm[curKey]] : [];
        fm[curKey].push(Parser.cleanVal(listMatch[1]));
        continue;
      }
      const kv = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if(kv){
        curKey = kv[1];
        const val = kv[2].trim();
        fm[curKey] = val==='' ? '' : Parser.cleanVal(val);
      }
    }
    return {fm, body:m[2]||''};

  parseRegion(raw){
    if(!raw) return null;
    const t = String(raw).trim();
    if(COUNTRY_ALIASES[t]) return { country: COUNTRY_ALIASES[t], subregion: null };
    // 已经是WorldMapData认识的英文国名（比如笔记里直接写了"Japan"）
    if(WorldMapData.PATHS[t]) return { country: t, subregion: null };
    if(REGION_ALIASES[t]) return { country: REGION_ALIASES[t].country, subregion: REGION_ALIASES[t].region };
    return undefined; // 既不是国家也不是已登记的地名，认不出来
  },
  // defaultYear：来自笔记frontmatter的`year`字段，没有就是undefined/null。
  // 月/日不要求补零，"8-1"和"08-01"是一回事——写全4位年份的写法永远优先
  // 尝试，短写法（不带年份，只有月/月-日）只在传了defaultYear时才认，
  // 免得没填year字段的笔记里，本来想表示"年份8"的两位数被误判成月份。
  parseDatePart(tok, defaultYear){
    const s = tok.trim();
    const full = s.match(/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/);
    if(full){
      const year = +full[1];
      const month = full[2] ? +full[2] : null;
      const day = full[3] ? +full[3] : null;
      // 之前这里只有短写法（下面defaultYear分支）做了1-12/1-31范围校验，
      // 完整4位年份这条分支一直没做，"2099-99"这种非法月份会被当成合法
      // 日期悄悄吃进去——补齐同一套校验，两边规则保持一致。
      if(month!==null && (month<1 || month>12)) return null;
      if(day!==null && (day<1 || day>31)) return null;
      const precision = day ? 'day' : month ? 'month' : 'year';
      return { year, month, day, precision };
    }
    if(defaultYear){
      const short = s.match(/^(\d{1,2})(?:-(\d{1,2}))?$/);
      if(short){
        const month = +short[1];

        if(month>=1 && month<=12 && (day===null || (day>=1 && day<=31))){

  parseDate(raw, defaultYear){
    if(raw===undefined || raw===null || raw==='') return null;
    const s = String(raw).trim();

      const start = Parser.parseDatePart(a, defaultYear);
      if(!start) return null;
      const bTrim = (b||'').trim();
      const end = bTrim==='' ? 'ongoing' : Parser.parseDatePart(bTrim, defaultYear);
      if(end !== 'ongoing' && !end) return null;
      return { isRange:true, start, end };
    }
    const start = Parser.parseDatePart(s, defaultYear);
    if(!start) return null;
    return { isRange:false, start, end:null };

  parseNoteYear(raw, basename, warnings){

    const n = parseInt(raw, 10);
    if(Number.isInteger(n) && n>=1000 && n<=9999) return n;

     这几张登记表全是同一套解析逻辑，靠标题文字路由到不同小节。 */
  parseCategoryList(body, heading){
    const cats = new Set();
    let inSection = false;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = h2[1].trim().includes(heading); continue; }
      const li = raw.match(/^[-*]\s+(.+)/);
      if(inSection && li) cats.add(li[1].trim());
    }
    return cats;

  parseCategoryRegistry(body){ return Parser.parseCategoryList(body, '分栏分类'); },
  parsePinnedCategories(body){ return Parser.parseCategoryList(body, '进度条固定栏位'); },
  /* 媒体分类跟「分栏分类」「进度条固定栏位」是并列的独立登记表，不要求
     同时也在「分栏分类」里——一个分类要么走分栏，要么走媒体卡片墙，
     没规定必须两头都登记。
     分类名后面缀一个"【Calendar】"标记（比如"Movie【Calendar】"），表示这个
     媒体分类除了正常进卡片墙，精确到"天"的日期（含「## 时间线」里的重看
     点日期）还会额外在日历格子里显示一行纯文字——不用再单独开一张「媒体
     日历分类」登记表，标记直接写在媒体分类这一行本身，少一层要维护的东西。
     解析出来的分类名已经把标记本身去掉了，不会带着"【Calendar】"这几个字
     混进真正的分类值里。 */
  parseMediaCategoriesWithCalendarFlag(body){
    const categories = new Set();
    const calendarCategories = new Set();
    let inSection = false;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = h2[1].trim().includes('媒体分类'); continue; }
      const li = raw.match(/^[-*]\s+(.+)/);
      if(!inSection || !li) continue;
      const flagMatch = li[1].match(/^(.+?)\s*【Calendar】\s*$/);
      if(flagMatch){
        const name = flagMatch[1].trim();
        categories.add(name);
        calendarCategories.add(name);
      } else {
        categories.add(li[1].trim());
      }

    return { categories, calendarCategories };
  },
  /* 日历跨度分类——登记在这里的分类，跨度事件（start~end）会在CalendarView的
     日历格子里显示cover色块盖住日期数字，跟「进度条固定栏位」并列但服务不同视图，
     一个分类正常不会同时登记进这两张表（代码不做强制互斥，靠使用者自己别重复登记）。 */
  parseCalendarSpanCategories(body){ return Parser.parseCategoryList(body, '日历跨度分类'); },
  /* 横向条目栏位——登记在这里的分类，会在新的"时间线"Tab里各占一行，横轴是
     时间、纵轴是分类，一眼看到不同类别在同一年内的分布；行的显示顺序就是
     这张表里登记的先后顺序，跟「分栏分类」等其他表完全独立、互不依赖。 */
  parseHorizontalRowCategories(body){ return Parser.parseCategoryList(body, '横向条目栏位'); },
  /* 节日——登记在这里的，每年到了这个月日就自动出现（不用每年建笔记）。
     格式是"emoji 空格 月-日"，比如"🎄 12-25"；想标记某一年某一天（而不是
     每年重复），走的是另一条路——单独建一篇笔记，写`icon:`字段，见下面
     buildStore里iconEvents那段。 */
  parseHolidayList(body){
    const list = [];
    let inSection = false;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = h2[1].trim().includes('节日'); continue; }
      const li = raw.match(/^[-*]\s+(.+)/);
      if(!inSection || !li) continue;
      const m = li[1].trim().match(/^(\S+)\s+(\d{1,2})-(\d{1,2})$/);
      if(m){
        const month = +m[2], day = +m[3];
        if(month>=1 && month<=12 && day>=1 && day<=31) list.push({icon:m[1], month, day});
      }
    }
    return list;
  },
  /* tags字段两种写法都认：逗号分隔的单行字符串（"石黑一雄, 布克奖"），
     或者YAML列表语法（parseNote会自动把它转成数组）——都统一成trim过的
     非空字符串数组。 */
  parseTags(raw){
    if(raw===undefined || raw==='') return [];
    if(Array.isArray(raw)) return raw.map(t=>String(t).trim()).filter(Boolean);
    return String(raw).split(/[,，]/).map(t=>t.trim()).filter(Boolean);
  },
  /* rating必须是1-5的整数，格式不对就当没填（并报警告），不强行按0/5兜底，
     免得"忘了填"和"打了最低分"混在一起分不清。 */
  parseRating(raw, basename, warnings){
    if(raw===undefined || raw==='') return null;
    const n = parseInt(raw, 10);
    if(Number.isInteger(n) && n>=1 && n<=5) return n;
    warnings.push(`${basename}：rating「${raw}」不是1-5的整数，已忽略`);
    return null;
  },
  /* frontmatter里"hide_from_rail: true"（Obsidian复选框打勾）表示"这条不想以
     进度条/色块这种醒目形式出现"——具体表现是这条笔记完全不会被推进spanEvents
     数组，SpanRail的固定栏位行/动态其他卡片、CalendarView的日历cover色块，
     这几处消费的都是同一份spanEvents，所以勾了这个开关等于同时从这几处隐藏，
     不是只管SpanRail一处；没写这个字段或者是false/没打勾，都当"正常显示"。
     字段名故意叫"hide_xxx"而不是"show_xxx"——勾选＝隐藏才符合打勾开关的直觉，
     不用像布尔值取反那样费脑子。 */
  isRailHidden(fm){
    if(fm.hide_from_rail===undefined) return false;
    return ['true','yes','1','是','隐藏'].includes(String(fm.hide_from_rail).trim().toLowerCase());
  },
  parseTimelineLine(raw, defaultYear){
    const li = raw.match(/^\s*[-*]\s*(.+)$/);
    if(!li) return null;
    const text = li[1].trim();

    // 至少3位数字才当"年份"处理（正常年份4位，负数公元前年份好歹也有3位数量级），
    // 这样"8-1 重看"这种1-2位开头的短写法才不会被误吃成"年份8"。
    const yearMatch = text.match(/^(-?\d{3,})/);
    if(yearMatch){
      const year = +yearMatch[1];
      let rest = text.slice(yearMatch[0].length);
      if(rest.startsWith('年')) rest = rest.slice(1);

      // 年份跨度——这一行本身横跨好几年（比如"2020年~2022年，读研"），只认年份，
      // 不细化到月日，跟frontmatter的date跨度是两回事，别搞混。
      let endYear = null;
      const rangeMatch = rest.match(/^\s*~\s*(-?\d+)年?/);
      if(rangeMatch){
        endYear = +rangeMatch[1];
        rest = rest.slice(rangeMatch[0].length);
      }

      // 月日——中文"5月2日"/"5月"，或者ISO短横线"-5-2"/"-5"，两种写法都认，
      // 也不要求补零（"-5-2"和"-05-02"一回事），想怎么写都行（跟frontmatter的
      // date字段/daily note行首日期保持同一种能力）。
      let month=null, day=null;
      const cnMd = rest.match(/^(\d{1,2})月(\d{1,2})日/);
      const cnMOnly = !cnMd && rest.match(/^(\d{1,2})月/);
      const isoMd = !cnMd && !cnMOnly && rest.match(/^-(\d{1,2})(?:-(\d{1,2}))?(?!\d)/);
      if(cnMd){ month=+cnMd[1]; day=+cnMd[2]; rest = rest.slice(cnMd[0].length); }
      else if(cnMOnly){ month=+cnMOnly[1]; rest = rest.slice(cnMOnly[0].length); }
      else if(isoMd){ month=+isoMd[1]; day=isoMd[2]?+isoMd[2]:null; rest = rest.slice(isoMd[0].length); }

      rest = rest.trim();
      return { year, month, day, endYear, text: rest };
    }

    // 没写年份——只有笔记frontmatter填了year字段才认这种短写法，年份从那儿补；
    // 至少得给出月份，不然没法判断这行到底是不是在讲日期。
    if(defaultYear){
      let rest = text;
      let month=null, day=null;
      const cnMd = rest.match(/^(\d{1,2})月(\d{1,2})日/);
      const cnMOnly = !cnMd && rest.match(/^(\d{1,2})月/);
      const dashMd = !cnMd && !cnMOnly && rest.match(/^(\d{1,2})-(\d{1,2})(?!\d)/);
      if(cnMd){ month=+cnMd[1]; day=+cnMd[2]; rest = rest.slice(cnMd[0].length); }
      else if(cnMOnly){ month=+cnMOnly[1]; rest = rest.slice(cnMOnly[0].length); }
      else if(dashMd){ month=+dashMd[1]; day=+dashMd[2]; rest = rest.slice(dashMd[0].length); }
      if(month!==null){
        rest = rest.trim();
        return { year: defaultYear, month, day, endYear:null, text: rest };
      }
    }
    return null;
  },
  /* 标题前后允许带装饰符号/emoji（比如"⏳ 时间线"、"📅时间线"），只去掉两端的
     非文字符号再比较，核心文字必须精确匹配——这样"时间线"不会被"小说时间线"
     误吃，抄的是history-dashboard.html的同名函数。 */
  normalizeHeading(t){
    return t.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, '').replace(/[^\u4e00-\u9fa5A-Za-z0-9]+$/, '');
  },
  parseTimelineSection(body, heading='时间线', defaultYear){
    const items = []; const skipped = [];
    let inSection = false;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = Parser.normalizeHeading(h2[1].trim()) === heading; continue; }
      if(!inSection) continue;
      if(raw.trim()===''){ continue; }
      const parsed = Parser.parseTimelineLine(raw, defaultYear);
      if(parsed) items.push(parsed); else skipped.push(raw.trim());
    }
    return { items, skipped };
  },
  /* ## 阶段——大跨度笔记内部套的几个小跨度（比如"住在上海"这条大跨度期间，
     搬过几次家，每次算一个小阶段）。纯粹是SpanRail进度条内部的可视化细分，
     不产生独立的spanEvent，不会出现在共时看板/日历cover/媒体看板这些地方——
     只在这条大跨度自己的进度条bar内部，用同色系深浅两种色块画出来分段。
     每行格式是"起~止 说明文字"，起止两段的日期写法跟date字段完全一样
     （8-1和08-01一回事，没写年份就用笔记的year字段兜底），直接复用
     parseDatePart，不是重新发明一套中文日期跨度解析。"止"可以省略——
     "起~ 说明"或者干脆"起~"，表示这一小段还在进行中，跟frontmatter的
     date字段"2024-01~"这种开放式跨度是同一个约定，不是两套规则。 */
  parseStageSection(body, defaultYear, basename, warnings){
    const stages = [];
    let inSection = false;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = Parser.normalizeHeading(h2[1].trim()) === '阶段'; continue; }
      if(!inSection) continue;
      const li = raw.match(/^\s*[-*]\s*(.+)$/);
      if(!li) continue;
      const line = li[1].trim();
      const m = line.match(/^(\S+)~(\S+)?(?:\s+(.*))?$/);
      if(!m){
        warnings.push(`${basename}：「## 阶段」里有一行格式不对（应该是"起~止 说明"，止可以省略表示进行中），已跳过——${line}`);
        continue;
      }
      const start = Parser.parseDatePart(m[1], defaultYear);
      const end = m[2] ? Parser.parseDatePart(m[2], defaultYear) : 'ongoing';
      if(!start || (end!=='ongoing' && !end)){
        warnings.push(`${basename}：「## 阶段」里有一行日期没认出来，已跳过——${line}`);
        continue;
      }
      stages.push({ start, end, text: (m[3]||'').trim() });
    }
    return stages;
  },
  PALETTE: ['#8A6D3B','#5B6E8C','#6E8C6B','#B5502E','#8A8577','#6B5B95','#3F7CAC','#A2703A','#4E7C59','#9B4D6E'],
  colorForCategory(name){
    let h = 0;
    for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return Parser.PALETTE[h % Parser.PALETTE.length];
  },
  isDailyNoteFilename(basename){
    return /^\d{4}-\d{2}-\d{2}$/.test(basename);
  },
  parseDailyNoteBody(body, registeredCategories){
    const entries = []; const warnings = [];
    for(const raw of body.split(/\r?\n/)){
      let line = raw.trim();
      if(!line) continue;

      // 日记正文每行前面都是Obsidian的列表符号（"- "/"* "/"+ "），这只是
      // Markdown的列表语法，不是内容本身，去掉，不然会显示成"- 今天天气不错"。
      // 有缩进的子项trim()已经把行首空格吃掉了，这里只处理符号本身。
      line = line.replace(/^[-*+]\s+/, '');
      if(!line) continue;

      // 行首可选日期前缀——写了就按这行自己的日期算（比如在今天的日记里补记
      // 之前某天/某月/某年的事），不写就默认归到这篇日记文件名代表的那一天。
      // 跟entity笔记「## 时间线」细节行"日期前缀可选"是同一条规则。
      let dateOverride = null;
      const dm = line.match(/^(\d{4}(?:-\d{2}(?:-\d{2})?)?)[，,、\s]+(.*)$/);
      if(dm){
        const parsed = Parser.parseDatePart(dm[1]);
        if(parsed){ dateOverride = parsed; line = dm[2].trim(); }
      }
      if(!line) continue; // 日期前缀吃掉一整行之后正文是空的，没什么好记

      // 有#标签就按老规矩：只认「已登记分类」的标签，命中的当作这条的分类，
      // 没命中任何已登记标签（包括压根没打标签、或打的标签没注册过）——
      // 归到「未标记」桶，category留null，交给下游渲染决定怎么显示/怎么归类。
      const tags = [...line.matchAll(/#([^\s#]+)/g)].map(m=>m[1]);
      const registeredHere = tags.filter(t=>registeredCategories.has(t));
      if(registeredHere.length>1){
        warnings.push(`这行有多个已登记标签（${registeredHere.join('、')}），只按第一个处理——${line}`);
      }
      const cat = registeredHere.length>0 ? registeredHere[0] : null;
      // 不管有没有分类，显示文本都去掉行内所有#标签（未注册的标签留着也是噪音）。
      const text = line.replace(/#([^\s#]+)/g, '').replace(/\s+/g,' ').trim();
      if(!text) continue; // 去标签后啥都不剩（纯打了个标签没写内容），没什么好记
      entries.push({ category:cat, text, dateOverride });
    }
    return { entries, warnings };
  },
  async *walk(dirHandle, path=''){
    for await (const [name, handle] of dirHandle.entries()){
      if(name.startsWith('.')) continue;
      if(handle.kind==='file' && name.endsWith('.md')){
        yield {handle, path:path+name};
      } else if(handle.kind==='directory'){
        yield* Parser.walk(handle, path+name+'/');
      }
    }
  },
  async scanVaultFiles(dirHandle){
    const files = [];
    for await (const {handle, path} of Parser.walk(dirHandle)){
      try{
        const file = await handle.getFile();
        const text = await file.text();
        files.push({path, text});
      } catch(e){ /* 单个文件读取失败先跳过，buildStore 不需要知道 */ }
    }
    return files;
  },
  buildStore(files){
    const warnings = [];
    const spanEvents = [];
    const entriesByYear = {};
    const entriesByDay = {};
    const entriesByYearMonthUnplaced = {};
    const regionsSeen = new Set();
    let registeredCategories = new Set();
    let pinnedCategories = new Set();
    let mediaCategories = new Set();
    let calendarSpanCategories = new Set();
    let mediaCalendarCategories = new Set();
    let horizontalRowCategories = new Set();
    const holidayFixed = [];
    const iconEvents = [];
    const mediaItems = [];
    let registryFound = false;

    files.forEach(f=>{
      const {fm, body} = Parser.parseNote(f.text);
      if(fm.type === 'category-registry'){
        registryFound = true;
        Parser.parseCategoryRegistry(body).forEach(c=>registeredCategories.add(c));
        Parser.parsePinnedCategories(body).forEach(c=>pinnedCategories.add(c));
        const mediaParsed = Parser.parseMediaCategoriesWithCalendarFlag(body);
        mediaParsed.categories.forEach(c=>mediaCategories.add(c));
        mediaParsed.calendarCategories.forEach(c=>mediaCalendarCategories.add(c));
        Parser.parseCalendarSpanCategories(body).forEach(c=>calendarSpanCategories.add(c));
        Parser.parseHorizontalRowCategories(body).forEach(c=>horizontalRowCategories.add(c));
        Parser.parseHolidayList(body).forEach(h=>holidayFixed.push(h));
      }
    });
    if(!registryFound) warnings.push('没找到 type: category-registry 的登记笔记，分栏暂时不会显示任何内容');

    // "未标记"桶：daily note里没打已登记标签的行，用这个key单独归堆，
    // 跟正常分类分开存，不会混进ColumnBoard的固定分栏卡片（那边只认
    // categorySlots/registeredCategories），只在CalendarView（月视图）里露出。
    const UNTAGGED_KEY = Parser.UNTAGGED_KEY;
    const addPointEntry = (dateInfo, category, text)=>{
      const isUntagged = category===null;
      if(!isUntagged && !registeredCategories.has(category)) return;
      const key = isUntagged ? UNTAGGED_KEY : category;
      const {year, month, day} = dateInfo;
      const entry = { text, month: month||null, day: day||null };
      if(day){
        const dkey = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        (entriesByDay[dkey] = entriesByDay[dkey]||{})[key] = (entriesByDay[dkey][key]||[]);
        entriesByDay[dkey][key].push(entry);
        (entriesByYear[year] = entriesByYear[year]||{})[key] = (entriesByYear[year][key]||[]);
        entriesByYear[year][key].push(entry);
      } else if(month){
        const mkey = `${year}-${String(month).padStart(2,'0')}`;
        (entriesByYearMonthUnplaced[mkey] = entriesByYearMonthUnplaced[mkey]||{})[key] = (entriesByYearMonthUnplaced[mkey][key]||[]);
        entriesByYearMonthUnplaced[mkey][key].push(entry);
        (entriesByYear[year] = entriesByYear[year]||{})[key] = (entriesByYear[year][key]||[]);
        entriesByYear[year][key].push(entry);
      } else {
        (entriesByYear[year] = entriesByYear[year]||{})[key] = (entriesByYear[year][key]||[]);
        entriesByYear[year][key].push(entry);
      }
    };

    files.forEach(f=>{
      const basename = f.path.split('/').pop().replace(/\.md$/,'');
      const {fm, body} = Parser.parseNote(f.text);
      if(fm.type === 'category-registry') return;

      if(Parser.isDailyNoteFilename(basename)){
        const [y,m,d] = basename.split('-').map(Number);
        const {entries, warnings:w} = Parser.parseDailyNoteBody(body, registeredCategories);
        w.forEach(msg=>warnings.push(`${basename}：${msg}`));
        entries.forEach(e=> addPointEntry(e.dateOverride || {year:y,month:m,day:d}, e.category, e.text));
        return;
      }

      if(fm.category===undefined && fm.date===undefined && !/^##\s+时间线/m.test(body)){
        return;
      }

      // 笔记级别的"默认年份"——date字段和「## 时间线」里的短写法（不带年份）
      // 都靠这个兜底；某一行/date自己写了完整年份的话，那份写法优先，
      // 这个字段只在没写年份时才顶上去。
      const noteYear = Parser.parseNoteYear(fm.year, basename, warnings);

      const region = fm.region_country ? Parser.parseRegion(fm.region_country) : null;
      if(fm.region_country && region===undefined){
        warnings.push(`${basename}：region_country「${fm.region_country}」认不出是国家还是已登记的地名，已跳过`);
      }
      if(region){
        regionsSeen.add(region.subregion ? `${region.country}_${region.subregion}` : region.country);
      }

      const { items, skipped } = Parser.parseTimelineSection(body, '时间线', noteYear);
      skipped.forEach(line=> warnings.push(`${basename}：「## 时间线」里有一行没识别出年份，已跳过——${line}`));

      // date 留空（比如模板笔记还没填）跟"写了但写错格式"是两回事，
      // 前者是正常状态、不该报警告；只有非空却解析不出来才算真的写错了。
      // date留空但填了year字段——当成"只知道年份，月日不清楚"处理，
      // 相当于隐式的 date: <year>。
      const dateHasContent = fm.date!==undefined && fm.date!=='';
      let dateInfo = dateHasContent ? Parser.parseDate(fm.date, noteYear) : null;
      if(dateHasContent && dateInfo===null){
        warnings.push(`${basename}：date 字段「${fm.date}」格式没认出来，已跳过`);
      }
      if(!dateHasContent && !dateInfo && noteYear){
        dateInfo = { isRange:false, start:{year:noteYear, month:null, day:null, precision:'year'}, end:null };
      }

      // icon字段——标记节日水印，跟category-registry「## 节日」小节（每年
      // 重复）不是一回事，这里是"某年某天/某年某段跨度"的一次性标记。不要求
      // 这篇笔记也有category，纯粹只为了这个水印新建一篇笔记完全可以，那样
      // 这篇笔记不会往格子正文里添加任何文字（下面的addPointEntry分支都要求
      // fm.category才会生效），但如果同时也有category，两边互不干扰，正常该
      // 显示的文字/色块照常显示，只是这天/这段跨度多一个水印。date如果是
      // 跨度（带~），水印覆盖整个跨度而不是只标起始那天；跟哪天有没有同时
      // 被其他事件命中、冲突了选谁，在CalendarView.holidayIconForDate渲染
      // 时判定（撞车了选跨度更短的那个），不在这里、也不报警告。
      if(fm.icon && dateInfo && dateInfo.start){
        iconEvents.push({
          icon: fm.icon,
          start: dateInfo.start,
          end: dateInfo.isRange ? dateInfo.end : dateInfo.start,
          source: basename,
        });
      }

      // 媒体分类（读书/观影这类）走独立管线——不进分栏、不进SpanRail，只喂
      // 媒体看板的卡片墙；重看/重读靠「## 时间线」里累加的点日期表示，
      // 跟主date的起止跨度是两回事（主date只代表"第一次"这一段的起止）。
      if(mediaCategories.has(fm.category)){
        mediaItems.push({
          id: basename, title: basename, category: fm.category,
          rating: Parser.parseRating(fm.rating, basename, warnings),
          tags: Parser.parseTags(fm.tags),
          origin: fm.origin ? String(fm.origin).trim() : null,
          coverUrl: fm.cover_url || null,
          start: dateInfo ? dateInfo.start : null,
          end: dateInfo ? (dateInfo.isRange ? dateInfo.end : dateInfo.start) : null,
          rewatches: items.map(it=>({year:it.year, month:it.month, day:it.day, text:it.text})),
        });
        return;
      }

      if(dateInfo){
        if(dateInfo.isRange){
          // hide_from_rail: true —— 这条笔记不想以进度条/色块这种醒目形式出现
          // （SpanRail的行/卡片、CalendarView的日历cover都不会显示），精确到
          // 单篇笔记的开关，即使同分类其他笔记都正常显示。
          if(!Parser.isRailHidden(fm)){
            spanEvents.push({
              id: basename, category: fm.category || 'other', title: basename,
              start: dateInfo.start, end: dateInfo.end, region,
              timelineItems: items.map(it=>({year:it.year, month:it.month, day:it.day, text:it.text})),
              stages: Parser.parseStageSection(body, noteYear, basename, warnings),
            });
          }
        } else if(fm.category && items.length===0){
          // 单值date的"文件名兜底"只在「## 时间线」没产出任何真实内容时才用——
          // 不然文件名和时间线内容会同时显示，变成两条重复的记录。
          addPointEntry(dateInfo.start, fm.category, basename);
        }
      }

      if(fm.category){
        items.forEach(it=>{
          addPointEntry({year:it.year, month:it.month, day:it.day}, fm.category, it.text || basename);
        });
      }
    });

    // 冲突（两个不同emoji的iconEvents日期重叠）不在这里报警告——
    // 挑哪个显示的判定逻辑在CalendarView.holidayIconForDate里（撞车了
    // 选跨度更短的那个），只是不在警告条里提示了。

    return {
      warnings, spanEvents, entriesByYear, entriesByDay, entriesByYearMonthUnplaced,
      visitedRegions: [...regionsSeen], registeredCategories: [...registeredCategories],
      pinnedCategories: [...pinnedCategories],
      mediaItems, mediaCategories: [...mediaCategories],
      calendarSpanCategories: [...calendarSpanCategories],
      mediaCalendarCategories: [...mediaCalendarCategories],
      horizontalRowCategories: [...horizontalRowCategories],
      holidayFixed, iconEvents,
    };
  }
};

/* =========================================================
   2.5 Utils —— 无状态小工具（跟 history-dashboard.html 的 Utils.escapeHtml 同一份实现）
   ========================================================= */
const Utils = {
  escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
};

function deriveStore(raw){
  RawStore = raw;

      hasMap: !!ref.hasMap,
      regions: ref.regions.map(name=>({
        name, visited: raw.visitedRegions.includes(`${country}_${name}`)

    };
  });
  Store = {
    visitedCountries: [...visitedCountrySet],
    drilldown,
    spanEvents: raw.spanEvents,
    entriesByYear: raw.entriesByYear,
    entriesByDay: raw.entriesByDay,

    horizontalRowCategories: raw.horizontalRowCategories,

function pad2(n){ return String(n).padStart(2,'0'); }
function miOfDateObj(d, isEnd){
  if(!d) return null;
  const month = d.month || (isEnd ? 12 : 1);
  return d.year*12 + (month-1);
}
const NOW_MI = NOW.getFullYear()*12 + NOW.getMonth();

// 精度不够时按“最保守的边界”补：起点没写月/日就当1月1日，
// 终点没写月就当12月、没写日就当那个月的最后一天——跟月索引换算（miOfDateObj）
// 用的是同一套“起点尽量早、终点尽量晚”的默认规则，只是这里要精确到天。
function dateObjToJSDate(d, isEnd){
  if(!d) return null;
  const month = d.month || (isEnd ? 12 : 1);
  const day = d.day || (isEnd ? new Date(d.year, month, 0).getDate() : 1);
  return new Date(d.year, month-1, day);
}
// 跨度事件的"天数/年数"附加显示——默认只有超过100天才显示，
// 短的跨度显示这个意义不大，反而会让每条进度条都很吵。
const DURATION_DISPLAY_MIN_DAYS = 100;
// 只比较“日历日期”，不掺和具体几点几分——两个Date各自转成当天0点的UTC毫秒数再相减，
// 这样“今天”不管是在中午之前还是之后打开页面，同一个开始日期算出来的天数都是同一个值，
// 不会因为算的时刻不同而多1天或少1天。
function daysBetweenDateOnly(a, b){
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcB - utcA) / 86400000);
}
function durationSuffix(startObj, endObj){
  const startDate = dateObjToJSDate(startObj, false);
  const endDate = endObj==='ongoing' ? NOW : dateObjToJSDate(endObj, true);
  const rawDays = daysBetweenDateOnly(startDate, endDate);
  if(rawDays <= DURATION_DISPLAY_MIN_DAYS) return '';
  // “第几天”是首尾都算的计数习惯（开始那天算第1天，不是第0天），所以+1；
  // 年数换算也用这个+1之后的天数，两个数字背后是同一套计数逻辑，不会对不上。
  const days = rawDays + 1;
  const years = (days/365.25).toFixed(1);
  return ` · 第${days}天/${years}年`;
}

}

/* =========================================================
   7. SpanRail
   ========================================================= */
const SpanRail = {
  pointerMI(){
    if(State.gran==='year') return State.year*12 + 5;
    return State.year*12 + (State.month-1);
  },
  eventsByCategory(cat){ return Store.spanEvents.filter(e=>e.category===cat); },
  // 返回“当前时间指针落在这段范围内”的所有事件（可能不止一条——比如A的结束月
  // 跟B的开始月是同一个月，交接月里两条都是真实存在的，不能只留一条）。
  // 时间没到/已经过了的一律不算，返回空数组。
  pickForPointer(events, pointer){
    return events.filter(e=>{
      const s = miOfDateObj(e.start,false), en = e.end==='ongoing' ? NOW_MI : miOfDateObj(e.end,true);
      return pointer>=s && pointer<=en;
    }).sort((a,b)=> dateObjToJSDate(a.start,false) - dateObjToJSDate(b.start,false));
  },
  fmtDateObj(d){
    if(!d) return '';
    if(d.precision==='day') return `${d.year}-${pad2(d.month)}-${pad2(d.day)}`;
    if(d.precision==='month') return `${d.year}-${pad2(d.month)}`;
    return String(d.year);
  },
  // "## 阶段"细分色块——按天精度算在父跨度自己[start,end]区间里的位置占比，
  // 跟rail-marker那套按月指针算"现在进度到哪"是两套不同粒度的计算，互不干扰。
  // 相邻阶段交替深浅两种同色系透明度，方便肉眼分清"这是好几段"而不是一整条。
  // 文字用悬浮title显示，不直接嵌在色块里——阶段通常比父跨度短很多，色块很窄，
  // 嵌文字大概率被截断看不全，悬浮框不受宽度限制，更可靠。
  stagesHtml(ev){
    if(!ev.stages || ev.stages.length===0) return '';
    const color = Parser.colorForCategory(ev.category);
    const parentS = dateObjToJSDate(ev.start, false).getTime();
    const parentEndDate = ev.end==='ongoing' ? NOW : dateObjToJSDate(ev.end, true);
    const total = Math.max(parentEndDate.getTime() - parentS, 1);
    return ev.stages.map((st,i)=>{
      const sJs = dateObjToJSDate(st.start, false).getTime();
      const eJsRaw = st.end==='ongoing' ? NOW : dateObjToJSDate(st.end, true);
      const eJs = new Date(eJsRaw.getFullYear(), eJsRaw.getMonth(), eJsRaw.getDate()+1).getTime();
      const leftPct = Math.min(100, Math.max(0, ((sJs-parentS)/total)*100));
      const rightPct = Math.min(100, Math.max(0, ((eJs-parentS)/total)*100));
      const widthPct = Math.max(rightPct-leftPct, 0.6);
      const endLabel = st.end==='ongoing' ? '进行中' : this.fmtDateObj(st.end);
      const dateLabel = `${this.fmtDateObj(st.start)} – ${endLabel}${durationSuffix(st.start, st.end)}`;
      const tip = st.text ? `${st.text}（${dateLabel}）` : dateLabel;
      const alpha = i%2===0 ? '66' : '40';
      return `<div class="rail-stage" style="left:${leftPct}%;width:${widthPct}%;background:${color}${alpha}" title="${Utils.escapeHtml(tip)}"></div>`;
    }).join('');
  },
  trackHtml(ev, pointer){
    const color = Parser.colorForCategory(ev.category);
    const s = miOfDateObj(ev.start,false), en = ev.end==='ongoing' ? NOW_MI : miOfDateObj(ev.end,true);
    const total = Math.max(en-s,1);
    const pct = Math.min(100, Math.max(0, ((pointer-s)/total)*100));
    const endLabel = ev.end==='ongoing' ? '进行中' : this.fmtDateObj(ev.end);
    const durSuffix = durationSuffix(ev.start, ev.end);
    return `<div class="rail-track" style="background:${color}2E">
      ${this.stagesHtml(ev)}
      <div class="rail-name">${Utils.escapeHtml(ev.title)}（${this.fmtDateObj(ev.start)} – ${endLabel}）${durSuffix}</div>
      <div class="rail-marker" style="left:${pct}%; background:${color}"></div>
    </div>`;
  },
  // evs为空 -> “还没记录”；只有1条 -> 跟原来一样单条铺满；2条以上（同一分类的交接月）
  // -> 标签只出现一次，多条进度条并排挤在同一行，中间留个小gap，而不是标签重复好几遍。
  rowHtml(label, evs, pointer){
    if(evs.length===0){
      return `<div class="rail-row">
        <div class="rail-row-label">${Utils.escapeHtml(label)}</div>
        <div class="rail-empty-text">还没记录</div>
      </div>`;
    }
    if(evs.length===1){
      return `<div class="rail-row">
        <div class="rail-row-label">${Utils.escapeHtml(label)}</div>
        ${this.trackHtml(evs[0], pointer)}
      </div>`;
    }
    return `<div class="rail-row">
      <div class="rail-row-label">${Utils.escapeHtml(label)}</div>
      <div class="rail-multi-track">${evs.map(ev=>this.trackHtml(ev, pointer)).join('')}</div>
    </div>`;
  },
  render(){
    const pointer = this.pointerMI();
    const rail = document.getElementById('spanRail');
    const pinnedCats = Store.pinnedCategories || [];
    // 固定栏位：一张卡片，每个分类固定一行——命中几条就在这一行里放几条进度条。
    const pinnedRows = pinnedCats.map(cat=>{
      const evs = this.pickForPointer(this.eventsByCategory(cat), pointer);
      return this.rowHtml(cat, evs, pointer);
    }).join('');
    // 动态其他分类：另一张卡片——只剩"既不是固定栏位、也不是日历跨度分类"的
    // 剩余分类才会出现在这里；日历跨度分类已经改成在CalendarView的日历格子里
    // 用cover色块显示，不用再在这张卡片里重复一遍。
    const otherCats = [...new Set(Store.spanEvents.map(e=>e.category))]
      .filter(c=>!pinnedCats.includes(c) && !(Store.calendarSpanCategories||[]).includes(c));
    const dynRows = otherCats.map(cat=>{
      const evs = this.pickForPointer(this.eventsByCategory(cat), pointer);
      return evs.length ? this.rowHtml(cat, evs, pointer) : '';
    }).join('');

    let html = `<div class="rail-card">${pinnedRows}</div>`;
    if(dynRows) html += `<div class="rail-card">${dynRows}</div>`;
    rail.innerHTML = html;
  }
};
