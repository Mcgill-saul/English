<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F WORLD B · 时间坐标</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #F5F2E9;
    --surface: #FBF9F3;
    --surface-2: #EFEADC;
    --ink: #1F2430;
    --ink-soft: #4A4638;
    --muted: #8A8578;
    --line: #DCD5C4;
    --asia: #C98A2B;
    --europe: #2E8E86;
    --americas: #B24E36;
    --africa: #7C8A3C;
    --oceania: #8A5A8C;
    --global: #6B5B95;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31,36,48,.06), 0 8px 24px -12px rgba(31,36,48,.18);

    /* 字号规范：按用途分 8 档，全文所有 font-size 都应该引用这里，不再单独写数字 */
    --fs-display: 46px;  /* 页面级超大数字：年份、Global 标题 */
    --fs-xl:      22px;  /* 一级标题：品牌名、对比人物名 */
    --fs-lg:      18px;  /* 二级标题：空状态大字、下拉输入框 */
    --fs-md:      16px;  /* 三级标题：卡片/分栏标题 */
    --fs-base:    15px;  /* 四级标题：tab、大洲标签、聚类小节标题 */
    --fs-body:    13px;  /* 正文：事件行、时间线文字、按钮 */
    --fs-sm:      12px;  /* 小字：标签徽标、次要信息、说明文字 */
    --fs-xs:      11px;  /* 极小字：日期戳、坐标轴刻度、图钉文字 */
    --fs-micro:   9px;   /* 地图内嵌 SVG 文字，物理空间受限，独立于正文级别 */
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- shell ---------- */
  .app{ width: min(97vw, 2400px); margin: 0 auto; padding: 14px 32px 80px; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size:var(--fs-xl); font-weight:600; margin:0; letter-spacing:.2px; }
  .brand .sub{ font-size:var(--fs-sm); color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .conn{ display:flex; align-items:center; gap:10px; font-size:var(--fs-body); color:var(--ink-soft); }
  .dot{ width:8px; height:8px; border-radius:50%; background:#C0392B; display:inline-block; }
  .dot.on{ background:#3E8E5A; }
  .btn{
    font-family:'Inter',sans-serif; font-size:var(--fs-body); font-weight:500; cursor:pointer;
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); transition:.15s ease;
  }
  .btn:hover{ border-color:var(--ink-soft); }
  .btn:focus-visible{ outline:2px solid var(--global); outline-offset:2px; }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:5px 10px; font-size:var(--fs-sm); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:14px; }
  .tabs-main{ display:flex; gap:6px; }
  .tab{
    font-family:'Fraunces',serif; font-size:var(--fs-base); font-weight:500; cursor:pointer;
    padding:9px 20px; border-radius:999px; border:1px solid transparent; color:var(--muted);
  }
  .tab.active{ background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow); }
  .tab:focus-visible{ outline:2px solid var(--global); outline-offset:2px; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .empty{
    text-align:center; padding:70px 20px; color:var(--muted);
    background:var(--surface); border-radius:var(--radius); border:1px dashed var(--line);
  }
  .empty .display{ font-size:var(--fs-lg); color:var(--ink); margin-bottom:8px; }
  .warn-strip{
    font-size:var(--fs-sm); color:#8A5A2E; background:#F4E8D6; border:1px solid #E4CFA6;
    padding:8px 14px; border-radius:10px; margin-bottom:16px; display:none; font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- time board ---------- */
  .year-rail{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:24px 24px; margin-bottom:20px;
  }
  /* margin-bottom 数值本身不大，但 .year-big 是 46px/line-height:1 的等宽字体，
     数字字形实际墨迹高度只占这个行框的七成左右，底下还留着一截没被数字用满的
     "降部预留空间"（即使数字没有降部，字体度量本身依然保留这块空间）。
     这块隐藏空白会跟 margin-bottom 叠加，导致视觉间距比数值本身大得多——
     所以这里给的 margin-bottom 比数字直觉上"应该给多少"要更小，才能抵消这部分隐藏空白。 */
  .year-rail-top{ display:flex; align-items:center; gap:20px; margin-bottom:2px; }
  /* 现在这就是唯一的年份数字：本质上还是个 <input type="number">（能点、能打字、能改），
     但去掉了输入框该有的边框/背景/内边距，字号跟原来纯展示用的大数字一样大，
     视觉上不再"看起来像个输入框"。 */
  .year-big{
    font-family:'IBM Plex Mono', monospace; font-size:var(--fs-display); font-weight:600; line-height:1;
    flex:none; text-align:left; border:none; background:transparent; padding:0; color:var(--ink);
    width:5.5ch; -moz-appearance:textfield;
  }
  .year-big::-webkit-outer-spin-button, .year-big::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .year-big:focus-visible{ outline:2px solid var(--global); outline-offset:3px; border-radius:4px; }
  .slider-wrap{ position:relative; padding-top:2px; }
  /* 轨道显式定义在 ::-webkit-slider-runnable-track / ::-moz-range-track 这两个
     伪元素上，不再让外层 <input> 的 background/height 隐式顶替——之前没显式定义
     轨道伪元素时，Chrome 会用它自己的默认间距逻辑决定轨道精确渲染位置，这个默认值
     跟外层 <input> 的盒子边界不完全重合，导致拇指圆心跟视觉上的线对不齐。
     颜色改用 CSS 变量 --slider-bg（默认回退到 --line）：JS 没法直接操作伪元素的
     style，只能通过设置外层 <input> 上的自定义属性、让伪元素的 CSS 规则去读它。 */
  input[type=range]{
    -webkit-appearance:none; width:100%; height:18px; background:transparent; outline:none; margin:0; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    width:100%; height:4px; border-radius:2px; background:var(--slider-bg, var(--line));
  }
  input[type=range]::-moz-range-track{
    width:100%; height:4px; border-radius:2px; background:var(--slider-bg, var(--line));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--ink); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--ink); cursor:pointer;
    margin-top:-7px; /* (轨道高度4px - 拇指高度18px)/2，让拇指圆心精确落在轨道中心线上 */
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:var(--ink); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--ink); cursor:pointer;
  }
  .ticks{ display:flex; justify-content:space-between; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:var(--fs-xs); color:var(--muted); }

  /* Global 横幅：嵌进年份轴这一行，在大数字和输入框中间；
     year-rail-top 用 space-between，三个孩子两两之间的间距天然相等，不用手动配置左右留白 */
  .global-banner{ flex:1; min-width:0; display:none; }
  .global-banner.show{ display:flex; justify-content:center; }
  .global-chip-row{ display:flex; align-items:center; gap:10px; }
  .global-chip{
    font-family:'Fraunces',serif; font-size:var(--fs-xl); font-weight:600; line-height:1.15;
    color:#F2EEF8; background: linear-gradient(135deg, var(--global), #4E4270);
    padding:8px 20px; border-radius:999px; white-space:nowrap;
  }

  .view-switch{ display:flex; gap:8px; }
  .view-tab{
    font-size:var(--fs-sm); padding:6px 14px; border-radius:999px; border:1px solid var(--line);
    color:var(--ink-soft); cursor:pointer; user-select:none; background:var(--surface);
  }
  .view-tab.active{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .column-board{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:start; }
  .col-card{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; min-height:200px;
  }
  .col-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .col-swatch{ width:9px; height:9px; border-radius:50%; flex:none; }
  .col-title{ font-family:'Fraunces',serif; font-size:var(--fs-md); font-weight:600; flex:0 0 auto; min-width:34px; }
  .col-head-bar{ flex:1; min-width:0; }
  .col-head-bar .bg-item{ margin-bottom:0; }
  .bg-split{ display:flex; gap:8px; }
  .bg-split .bg-item{ flex:1; min-width:0; margin-bottom:0; }
  .col-slot{ margin-bottom:18px; padding-bottom:18px; border-bottom:1px dashed var(--line); min-height:176px; }
  .col-slot.coverage-slot{ min-height:0; }  /* 背景区不参与四栏对齐撑高，只要两行的高度就够 */
  .col-slot-content{ max-height:140px; overflow-y:auto; }
  .col-slot:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .col-slot-span{ padding-bottom:12px; min-height:40px; }  /* 下方留白改成跟上方(col-head 的 12px)一致，条形本身27px+这12px+1px边框 */
  /* 跨度事件在"自有空间"显示时（不跟标题同行），可能是多行堆叠——每行要么是单个
     .bg-item，要么是两个凑一对的 .bg-split。.bg-split 内部两个 .bg-item 的
     margin-bottom 被清零了（为了同一行内贴着排），但这样清零漏了给"行与行之间"
     留呼吸空间——这里直接对 col-slot-span 的直接子元素（不管是行内单个 .bg-item
     还是 .bg-split 那一整行）统一补上，跟地图那边 .bg-progress 的间距(10px)保持一致。 */
  .col-slot-span > *{ margin-bottom:10px; }
  .col-slot-span > *:last-child{ margin-bottom:0; }
  .col-slot-empty{ font-size:var(--fs-sm); color:var(--muted); opacity:.5; padding:6px 0; }
  @media (max-width: 980px){ .column-board{ grid-template-columns:repeat(2,1fr); } }
  .map-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px; position:relative; }
  .map-stage{ position:relative; width:100%; }
  .map-card svg{ width:100%; height:auto; display:block; }
  /* 真实国家轮廓：已登记国家按大洲上色、可点；未登记的背景国家中性灰、
     点击打开所在大洲的"其他"抽屉——背景色块本身就是这个入口，
     不需要再像图钉时代那样单独找个位置画一个"其他"标记。 */
  .country{ stroke:var(--surface); stroke-width:.4; transition:fill-opacity .15s ease, stroke-width .15s ease; }
  .country.bg{ fill:#D8D3C4; cursor:pointer; }
  .country.bg:hover{ fill:#CFC9B6; }
  .country.registered{ fill-opacity:.86; stroke-width:.6; cursor:pointer; }
  .country.registered:hover{ fill-opacity:1; }
  .country.registered.dim{ fill-opacity:.35; }
  .country.registered.active{ stroke:var(--ink); stroke-width:1.8; fill-opacity:1; }
  .country.fallback-dot{ stroke:var(--surface); stroke-width:1.2; }

  /* 悬浮卡片：已登记国家，直接锚定在地图对应位置 */
  .popover{
    position:absolute; width:290px; max-height:360px; overflow-y:auto;
    background:var(--surface); border-radius:12px; box-shadow:0 4px 10px rgba(31,36,48,.1), 0 20px 40px -14px rgba(31,36,48,.28);
    padding:16px 18px; z-index:20; border:1px solid var(--line);
  }
  .popover-close{
    position:absolute; top:8px; right:10px; cursor:pointer; color:var(--muted); font-size:var(--fs-md); line-height:1;
    background:none; border:none; padding:4px;
  }
  .popover-close:hover{ color:var(--ink); }
  .detail-empty{ color:var(--muted); font-size:var(--fs-body); padding-top:2px; }
  .detail-head{ display:flex; align-items:center; gap:9px; margin-bottom:12px; padding-right:16px; }
  .detail-swatch{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .detail-title{ font-family:'Fraunces',serif; font-size:var(--fs-md); font-weight:600; }

  /* "其他"聚合：右侧滑出抽屉 */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(31,36,48,.25); z-index:29; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .drawer-backdrop.show{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; width:360px; max-width:88vw; height:100vh; background:var(--surface);
    box-shadow:-8px 0 30px rgba(31,36,48,.18); z-index:30; padding:26px 24px; overflow-y:auto;
    transform:translateX(100%); transition:transform .25s ease;
  }
  .drawer.show{ transform:translateX(0); }
  .drawer-close{
    position:absolute; top:18px; right:20px; cursor:pointer; background:none; border:none; font-size:var(--fs-lg); color:var(--muted);
  }
  .drawer-close:hover{ color:var(--ink); }

  .bg-progress{ margin-bottom:16px; }
  .bg-item{ margin-bottom:10px; }
  .bg-item:last-child{ margin-bottom:0; }
  .bg-track{
    height:27px; border-radius:7px; position:relative; overflow:visible;
    display:flex; align-items:center; padding:0 10px;
  }
  .bg-name{
    position:relative; z-index:1; font-size:var(--fs-sm); font-weight:600; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bg-ruler{ margin-left:8px; }
  .bg-dot{
    position:absolute; top:-4px; bottom:-4px; width:6px; border-radius:3px;
    transform:translateX(-50%); border:2px solid var(--surface); filter:brightness(.85) saturate(1.05);
  }
  .bg-info{ position:relative; margin-left:auto; z-index:3; flex:none; }
  .bg-info-icon{
    display:flex; align-items:center; justify-content:center;
    width:16px; height:16px; border-radius:50%; background:var(--ink); color:var(--surface);
    font-size:var(--fs-xs); font-weight:700; font-family:'Fraunces',serif; cursor:default;
  }
  .bg-tooltip{
    display:none; position:absolute; right:0; top:calc(100% + 8px); width:240px;
    background:var(--ink); color:var(--surface); font-size:var(--fs-sm); line-height:1.6;
    padding:10px 12px; border-radius:8px; box-shadow:var(--shadow); text-align:left;
  }
  .bg-info:hover .bg-tooltip, .bg-info:focus .bg-tooltip{ display:block; }

  .domain-group{ margin-bottom:14px; }
  .domain-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); font-weight:500;
    padding:3px 9px; border-radius:999px; margin-bottom:6px; font-family:'IBM Plex Mono',monospace;
  }
  .event-row{
    font-size:var(--fs-body); line-height:1.55; padding:6px 0 6px 14px; border-left:2px solid var(--line);
    margin-bottom:2px;
  }
  .event-row .ev-title{ font-weight:500; }
  .event-row .ev-date{ font-size:var(--fs-xs); color:var(--muted); margin-right:6px; }
  .event-row .ev-fiction{ font-size:var(--fs-xs); color:var(--muted); font-style:italic; }

  /* ---------- subject board ---------- */
  .subject-pickers{ display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:center; margin-bottom:24px; }
  .picker{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; }
  .picker label{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .picker input{
    width:100%; margin-top:8px; font-family:'Fraunces',serif; font-size:var(--fs-lg); padding:8px 4px;
    border:none; border-bottom:2px solid var(--line); background:transparent; color:var(--ink);
  }
  .picker input:focus-visible{ outline:none; border-bottom-color:var(--ink); }
  .vs{ font-family:'Fraunces',serif; font-style:italic; color:var(--muted); font-size:var(--fs-lg); text-align:center; }

  .compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .compare-col{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; }
  .compare-name{ font-family:'Fraunces',serif; font-size:var(--fs-xl); font-weight:600; margin-bottom:2px; }
  .compare-span{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-sm); color:var(--muted); margin-bottom:18px; }
  .compare-summary{ font-size:var(--fs-body); line-height:1.65; color:var(--ink-soft); white-space:pre-line; margin:-6px 0 18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .related-group{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); }
  .related-head{ font-size:var(--fs-xs); color:var(--muted); letter-spacing:.05em; margin-bottom:8px; }
  .related-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .related-chip{ font-size:var(--fs-sm); color:var(--ink-soft); background:var(--surface-2); border-radius:20px; padding:4px 12px; }
  .related-chip-link{ cursor:pointer; transition:background .15s, color .15s; }
  .related-chip-link:hover{ background:var(--ink); color:var(--surface); }

  /* coverage_start/coverage_end 的作品 chip 墙：虚线弱化，跟"相关"chip 同一套语言但描边不同，
     容器固定两行高度（不是"最多两行"，内容不够也占着这个位置，行为对齐政治/经济/其它那几个区域），
     超出两行内部滚动，chip 内文字不截断、放不下整体挪下一行（flex-wrap 默认行为）。
     悬浮详情不用 CSS :hover 那套（position:absolute 会被这里的 overflow:auto 直接裁掉，
     不管 z-index 多高都没用），改成 JS 算坐标、扔进一个 position:fixed 的全局共用悬浮框，
     脱离这个滚动容器的裁剪范围。 */
  .coverage-chips{ display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; height:64px; overflow-y:auto; }
  .coverage-chip{
    display:inline-flex; align-items:center; white-space:nowrap;
    font-size:var(--fs-sm); color:var(--ink-soft); background:var(--surface-2);
    border:1px dashed var(--line); border-radius:20px; padding:4px 12px; cursor:default;
  }
  .chip-tooltip{
    display:none; position:fixed; z-index:999; width:220px; white-space:normal;
    background:var(--ink); color:var(--surface); padding:8px 10px; border-radius:8px;
    font-size:var(--fs-xs); line-height:1.5; box-shadow:var(--shadow); pointer-events:none;
  }
  .chip-tooltip.show{ display:block; }
  .chip-tooltip-range{ color:var(--muted); margin-bottom:4px; font-family:'IBM Plex Mono',monospace; }
  .chip-tooltip-title{ margin-bottom:4px; }
  .chip-tooltip-title:last-child{ margin-bottom:0; }
  .tl-item{ display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
  .tl-item:first-child{ border-top:none; }
  .tl-age{
    font-family:'IBM Plex Mono',monospace; font-size:var(--fs-sm); color:var(--muted);
    min-width:44px; text-align:right; padding-top:1px; flex-shrink:0;
  }
  .tl-body .tl-year{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-xs); color:var(--muted); }
  .tl-body .tl-title{ font-size:var(--fs-body); line-height:1.5; }
  .mentioned-group{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); }
  .mentioned-head{ font-size:var(--fs-xs); color:var(--muted); letter-spacing:.05em; margin-bottom:6px; }
  .mentioned-row{ display:flex; gap:8px; align-items:baseline; padding:4px 0; font-size:var(--fs-sm); color:var(--ink-soft); }
  .mentioned-year{ font-size:var(--fs-xs); color:var(--muted); min-width:34px; }

  datalist{}

  @media (max-width: 860px){
    .popover{ width:82vw; }
    .subject-pickers{ grid-template-columns:1fr; }

/* =========================================================
   代码结构说明（方案A重构）
   ---------------------------------------------------------
   全文件仍是一个 <script>（双击打开即用，不依赖本地服务器），
   但内部按职责拆进了下面这些命名空间对象，而不再是一坨裸露的
   全局函数 + 全局变量。新增功能时，先想清楚它属于哪个命名空间，
   把方法加进去就行，不用再满页面 Ctrl+F 找相关代码。

   0. 静态数据常量（大洲/国家/坐标/SVG路径……不会变的配置表，保持顶层裸露）
   1. Db           —— IndexedDB：记住上次选过的 vault 文件夹句柄
   2. Parser       —— frontmatter/正文解析 + 扫描 vault，产出 {events, persons, tagRegistry, warnings}
   3. Color        —— 大洲底色 -> 领域色阶
   4. Store        —— 唯一的可变状态容器（原来分散的 VAULT/currentYear/... 都在这里）
   5. Utils        —— 无状态小工具（escapeHtml / inRange）
   6. Query        —— 按 scope（大洲/国家/其他）+ 年份 查事件、查背景作品
   7. DetailView   —— 把 Query 的结果拼成 HTML：地图弹窗、抽屉、分栏共用这一份
   8. MapView      —— 地图 SVG 构建（真实国家轮廓）、悬浮卡定位、抽屉开关
   9. ColumnBoard  —— 分栏视图（常驻四栏，复用 DetailView）
   10. CompareView —— 主体看板（双人对比时间线）
   11. ChipTooltip —— coverage chip 悬浮详情（全局共用一个 tooltip 元素）
   12. App         —— 启动流程、连接 vault、年份轴、tabs、所有事件监听绑定
   ========================================================= */

/* =========================================================

   ---------------------------------------------------------
   纯静态配置表，不依赖任何状态、不会被运行时修改，所以继续放在
   顶层不进命名空间——包一层对象只会让下面几百行 SVG 路径字符串
   多一层缩进，没有实际收益。
   ========================================================= */

const COUNTRIES_BY_CONTINENT = {};

const Db = {
  NAME: 'fworldb-db',
  STORE: 'handles',
  open(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(Db.NAME, 1);
      req.onupgradeneeded = ()=> req.result.createObjectStore(Db.STORE);
      req.onsuccess = ()=> res(req.result);
      req.onerror = ()=> rej(req.error);
    });
  },
  async set(key, val){
    const db = await Db.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(Db.STORE, 'readwrite');
      tx.objectStore(Db.STORE).put(val, key);
      tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
    });
  },
  async get(key){
    const db = await Db.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(Db.STORE, 'readonly');
      const req = tx.objectStore(Db.STORE).get(key);
      req.onsuccess = ()=>res(req.result); req.onerror = ()=>rej(req.error);
    });
  }
};

const Parser = {

  cleanVal(v){
    v = (v||'').trim();
    if((v.startsWith('"')&&v.endsWith('"')) || (v.startsWith("'")&&v.endsWith("'"))) v = v.slice(1,-1).trim();
    const wl = v.match(/^\[\[([^\]|]+)(\|[^\]]+)?\]\]$/);
    if(wl) v = wl[1].trim();
    return v;
  },

  parseNote(text){
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if(!m) return {fm:{}, body:text};
    const lines = m[1].split(/\r?\n/);
    const fm = {}; let curKey=null;
    for(const line of lines){
      const listMatch = line.match(/^\s+[-*]\s+(.*)$/) || line.match(/^[-*]\s+(.*)$/);
      if(listMatch && curKey){
        if(!Array.isArray(fm[curKey])) fm[curKey] = fm[curKey] ? [fm[curKey]] : [];
        fm[curKey].push(Parser.cleanVal(listMatch[1]));
        continue;
      }
      const kv = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if(kv){
        curKey = kv[1];
        const val = kv[2].trim();
        fm[curKey] = val==='' ? '' : Parser.cleanVal(val);
      }
    }
    return {fm, body:m[2]||''};
  },

  normalizeCountry(raw){
    if(!raw) return raw;
    const t = String(raw).trim();
    return COUNTRY_ALIASES[t] || t;
  },

  /* 展示用：把正文里的 [[实体]] / [[实体|别名]] 换成纯文字，HTML 里不展示双链语法本身 */
  stripWikilinkSyntax(text){
    if(!text) return '';
    return text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,name,alias)=> alias||name);
  },

  toArr(v){ if(v===undefined||v===null||v==='') return []; return Array.isArray(v)?v.filter(Boolean):[v]; },

  parseDate(v){
    if(v===undefined||v===null||v==='') return null;
    const s = String(v).trim();
    const m = s.match(/^(-?\d+)(?:-(\d{2}))?(?:-(\d{2}))?/);
    if(!m) return null;
    return { year:+m[1], month:m[2]?+m[2]:null, day:m[3]?+m[3]:null };
  },

  isTrue(v){ return v===true || v==='true' || v==='True'; },

  /* 从一段文字里抓第一个"X月Y日"，用来给只精确到年的日期补月日精度 */
  extractMonthDay(text){
    if(!text) return null;
    const m = text.match(/(\d{1,2})月(\d{1,2})日/);
    if(!m) return null;
    return { month:+m[1], day:+m[2] };
  },

  /* 提取正文里的 [[双链]]，按出现顺序返回目标名称（自动去掉 |别名 部分） */
  extractWikilinks(text){
    if(!text) return [];
    const out = [];
    const re = /\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g;
    let m;
    while((m = re.exec(text))){ out.push(m[1].trim()); }
    return out;
  },

  /* 解析单独一行 "- 年份..." 格式的时间线记录，entity 和 event 共用。
     必须是 "- " 后紧跟年份（可选区间/公元前），否则返回 null（不认）。
     拆出 datePrefix（年份+紧跟的月日）和 rest（日期之后的正文），
     方便调用方决定要不要在日期后面插入主体名。 */
  parseTimelineLine(raw){
    const li = raw.match(/^\s*[-*]\s*(.+)$/);
    if(!li) return null;
    const text = li[1].trim();
    const ym = text.match(/^(-?\d+)年?(?:\s*~\s*(-?\d+)年?)?/);
    if(!ym) return null; // "- "后面不是年份开头，不认
    const year = +ym[1];
    const endYear = ym[2] ? +ym[2] : null;
    let datePrefix = ym[0];
    let rest = text.slice(ym[0].length);
    const leadingMd = rest.match(/^(\d{1,2})月(\d{1,2})日/);
    let month=null, day=null;
    if(leadingMd){
      month = +leadingMd[1]; day = +leadingMd[2];
      datePrefix += leadingMd[0];
      rest = rest.slice(leadingMd[0].length);
    } else {
      const leadingM = rest.match(/^(\d{1,2})月/);  // 只写月、没写日，也算日期前缀的一部分
      if(leadingM){
        month = +leadingM[1];
        datePrefix += leadingM[0];
        rest = rest.slice(leadingM[0].length);
      } else {
        const md = Parser.extractMonthDay(rest);
        if(md){ month = md.month; day = md.day; } // 句子中间提到的日期：只用于精度，不算前缀，留在 rest 里
      }
    }
    rest = rest.trim();
    return { year, endYear, month, day, datePrefix, rest, fullText: text };
  },

  /* 从正文里摘掉"## 时间线"这一段，只留其余部分（简述、经过……）。
     给 event 的"主事件"当展示内容用——时间线细节不在这里重复出现。 */
  /* 通用：按标题关键字（比如"简述"、"时间线"）从正文里摘出对应段落的纯文字内容
     （去掉标题行本身、去掉列表符号），或者反过来剔除掉这些段落只留其余部分。 */
  extractSection(body, keyword){
    if(!body) return '';
    const lines = body.split(/\r?\n/);
    const kept = [];
    let inSection = false;
    for(const raw of lines){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = h2[1].trim().includes(keyword); continue; }
      if(raw.match(/^#{1,2}\s+/)){ inSection = false; continue; }
      if(!inSection) continue;
      const li = raw.match(/^\s*[-*]\s*(.+)$/);
      kept.push(li ? li[1] : raw);
    }
    return kept.join('\n').trim();
  },

  stripSections(body, keywords){
    if(!body) return '';
    const lines = body.split(/\r?\n/);
    const kept = [];
    let skipping = false;
    for(const raw of lines){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){
        const t = h2[1].trim();
        skipping = keywords.some(k=>t.includes(k));
        continue; // 标题行本身永远不保留
      }
      if(raw.match(/^#{1,2}\s+/)){ skipping = false; continue; }
      if(skipping) continue;
      const li = raw.match(/^\s*[-*]\s*(.+)$/);
      kept.push(li ? li[1] : raw);
    }
    return kept.join('\n').trim();
  },

  stripTimelineSection(body){ return Parser.stripSections(body, ['时间线']); },

  /* entity / event 共用："## 时间线" 标题是唯一的开关——
     只有这个标题底下、下一个标题之前的 "- " 行才会被处理；
     标题之外的正文（简述、经过……随便叫什么名字）永远不受影响，照常整段显示。
     标题内部：带年份的行拆出来；不带年份的行会被跳过，同时记入 skipped，
     由调用方转成警告提示，不再静默丢数据。 */
  /* 标题前后允许带装饰符号（比如"⏳ 时间线"），只去掉两端的非文字符号再比较，
     核心文字部分必须精确匹配——这样"时间线"和"小说时间线"不会互相误吃，
     同时不影响你在标题前后加 emoji/符号的写法 */
  normalizeHeading(t){
    return t.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, '').replace(/[^\u4e00-\u9fa5A-Za-z0-9]+$/, '');
  },

  parseTimelineSection(body, keyword){
    keyword = keyword || '时间线';
    if(!body) return { items:[], skipped:[] };
    const lines = body.split(/\r?\n/);
    const items = [];
    const skipped = [];
    let inSection = false;
    for(const raw of lines){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = Parser.normalizeHeading(h2[1].trim()) === keyword; continue; }
      if(raw.match(/^#{1,2}\s+/)) { inSection = false; continue; } // 遇到下一个标题，段落结束
      if(!inSection) continue;
      if(!/^\s*[-*]\s*(.+)$/.test(raw)) continue; // 不是列表行（比如空行、说明文字），忽略
      const parsed = Parser.parseTimelineLine(raw);
      if(parsed) items.push(parsed);
      else skipped.push(raw.trim());
    }
    return { items, skipped };
  },

  /* "## 统治者" 专用的行解析。格式改成了直接写死起止年份："AAA（起始-结束）"，
     不再靠"继位/登基/称帝"这类关键词、也不再靠"下一条记录出现"去反推上一位
     什么时候卸任——每条记录自己就是一个完整、独立的区间，谁负责哪几年一目了然，
     不需要猜。名字（AAA）原样保留，不做任何加工（不特殊处理庙号/年号括号），
     用户写多短这里就显示多短。
     起止年份必须都写全——只写一边（比如"朱元璋（1368-）"或者没写括号）算格式错误，
     交给调用方产生警告；但"这一位到底要不要记进来"完全不做检测，跳过某几位、
     只记一头一尾、甚至只记一位，都不会有任何警告——这是允许的正常用法。 */
  parseRulerLine(raw){
    const li = raw.match(/^\s*[-*]\s*(.+)$/);
    if(!li) return null;
    const text = li[1].trim();
    const m = text.match(/^(.+?)[（(]\s*(-?\d+)\s*-\s*(-?\d+)\s*[）)]\s*$/);
    if(!m) return null; // 没匹配上"名字（起始-结束）"这个整体形状，格式不对，交给调用方产生警告
    const name = m[1].trim();
    const start = +m[2], end = +m[3];
    if(!name || end < start) return null; // 名字为空、或者结束年份比起始年份还早，都算格式不对
    return { name, start, end };
  },

  /* "## 统治者" 小节整体解析：标题识别规则跟 parseTimelineSection 完全一样
     （前后允许 emoji/符号，核心文字精确匹配"统治者"），只是每一行改用
     parseRulerLine 而不是 parseTimelineLine。识别不出格式的行同样记入
     skipped，交给调用方转成警告，不静默丢数据。 */
  parseRulerSection(body){
    if(!body) return { items:[], skipped:[] };
    const lines = body.split(/\r?\n/);
    const items = [];
    const skipped = [];
    let inSection = false;
    for(const raw of lines){
      const h2 = raw.match(/^##\s+(.+)/);
      if(h2){ inSection = Parser.normalizeHeading(h2[1].trim()) === '统治者'; continue; }
      if(raw.match(/^#{1,2}\s+/)) { inSection = false; continue; }
      if(!inSection) continue;
      if(!/^\s*[-*]\s*(.+)$/.test(raw)) continue;
      const parsed = Parser.parseRulerLine(raw);
      if(parsed) items.push(parsed);
      else skipped.push(raw.trim());
    }
    return { items, skipped };
  },

  /* 每条统治者记录自己就有明确的起止年份，只需要检测"两条记录的年份区间
     有没有重叠"——这个不可能是"故意跳过某人没记"造成的（跳过只会留出空档，
     不会产生重叠），只可能是起止年份哪里写错了，所以属于可以放心报警告的
     纯格式类错误，跟"漏记了谁"那种没法判断是否故意的情况不是一回事。
     只检查排序后相邻两条，够用——真正常见的typo场景（比如相邻两条年份抄错、
     首尾数字打反）都是相邻的，不需要对每一对都做 O(n²) 检查。
     用的是严格小于（<），不是小于等于——"上一位到1900年卸任，下一位1900年
     就继位"这种同一年交接是完全正常的写法（很常见），不算重叠；
     只有当下一位的起始年份严格早于上一位的结束年份，才是真正的冲突。 */
  findOverlappingRulers(rulers){
    const problems = [];
    const sorted = [...rulers].sort((a,b)=>a.start-b.start);
    for(let i=1;i<sorted.length;i++){
      if(sorted[i].start < sorted[i-1].end){
        problems.push(`${sorted[i-1].name}（${sorted[i-1].start}-${sorted[i-1].end}）和 ${sorted[i].name}（${sorted[i].start}-${sorted[i].end}）年份有重叠`);
      }
    }
    return problems;
  },

  /* tag-registry 解析 */
  parseTagRegistry(body){
    const result = {domain:[], carrier:[], countryMain:[], countrySecondary:[]};
    let section=null;
    for(const raw of body.split(/\r?\n/)){
      const h2 = raw.match(/^##\s+(.+)/);
      const h3 = raw.match(/^###\s+(.+)/);
      const li = raw.match(/^[-*]\s+(.+)/);
      if(h2){
        const t=h2[1].trim();
        section = t.includes('领域')?'domain': t.includes('载体')?'carrier': t.includes('国家')?'country': null;
        continue;
      }
      if(h3 && section==='country'){
        const t=h3[1].trim();
        section = t.includes('主要')?'countryMain': t.includes('次要')?'countrySecondary':'country';
        continue;
      }
      if(li && section && result[section]) result[section].push(li[1].trim());
    }
    return result;
  },

  /* 递归遍历 vault 目录，产出所有 .md 文件的 {handle, path} */
  async *walk(dirHandle, path=''){
    for await (const [name, handle] of dirHandle.entries()){
      if(name.startsWith('.')) continue;
      if(handle.kind==='file' && name.endsWith('.md')){
        yield {handle, path:path+name};
      } else if(handle.kind==='directory'){
        yield* Parser.walk(handle, path+name+'/');
      }
    }
  },

  /* 扫描整个 vault，产出 { events, persons, tagRegistry, warnings }。
     这是本命名空间唯一对外的入口，其余方法都是它的内部拆分步骤。 */
  async scanVault(dirHandle){
    const events=[], persons=[], warnings=[];
    let tagRegistry = {domain:DEFAULT_DOMAINS, carrier:[], countryMain:[], countrySecondary:[]};

    for await (const {handle, path} of Parser.walk(dirHandle)){
      if(path.startsWith('Templates/')) continue;
      let text;
      try{ const file = await handle.getFile(); text = await file.text(); }
      catch(e){ warnings.push(path+' 读取失败'); continue; }
      const {fm, body} = Parser.parseNote(text);
      const title = handle.name.replace(/\.md$/,'');

      if(fm.type === 'tag-registry'){
        tagRegistry = Parser.parseTagRegistry(body);
        continue;
      }
      if(fm.type === 'event'){
        const region = Parser.toArr(fm.region_country).map(Parser.normalizeCountry);
        const domain = Parser.toArr(fm.domain);
        const common = {
          title, path, keyEra: fm.key_era || '', timeNote: fm.time_note || '',
          region, domain, carrier: fm.carrier || '',
          related: Parser.toArr(fm.related), topic: Parser.toArr(fm.topic),
          fictional: Parser.isTrue(fm.is_fictional), body,
          mainEntity: null, mentionedEntities: []
        };
        // 主事件：frontmatter 的 start_year/end_year/key_era 永远生效（这是这件事的权威声明，
        // 不因为正文有没有"## 时间线"细节而被顶掉）。内容取"## 时间线"之外的正文（简述等）。
        // 如果这条有进度条（key_era 有值），"## 简述"单独摘出来放悬浮框，不在卡片正文里重复出现。
        const start = Parser.parseDate(fm.start_year);
        if(!start && !fm.time_note){ warnings.push(title+'：没有可识别的 start_year'); }
        const hasBar = fm.key_era === 'National';
        const summary = hasBar ? Parser.extractSection(body, '简述') : '';
        // "## 统治者"只喂给"现在在位是谁"这个计算用，不该原样出现在卡片正文里，
        // 所以要跟"简述""时间线"一样被排除在展示文字之外
        const mainBody = hasBar ? Parser.stripSections(body, ['简述','时间线','统治者']) : Parser.stripTimelineSection(body);
        const mdInBody = Parser.extractMonthDay(mainBody || summary);
        if(start && mdInBody && start.month===null){ start.month = mdInBody.month; start.day = mdInBody.day; }
        // "## 统治者"：只有带进度条的 National 级跨度事件才需要——给"现在在位是谁"这个
        // 常驻标注用。每条记录自带明确起止年份，渲染时直接查"当前年份落在哪条的
        // 区间里"即可，不用再排序推断谁先谁后（顺序不影响查找结果，存的时候按
        // 起始年份排一下只是为了 findOverlappingRulers 检测相邻重叠更方便）
        let rulers = [];
        if(hasBar){
          const { items: rulerItems, skipped: rulerSkipped } = Parser.parseRulerSection(body);
          rulerSkipped.forEach(line=>{ warnings.push(title+'：「## 统治者」里有一行没识别出「AAA（起始-结束）」格式，已跳过——'+line); });
          rulers = rulerItems.sort((a,b)=>a.start-b.start);
          Parser.findOverlappingRulers(rulers).forEach(msg=>{ warnings.push(title+'：「## 统治者」'+msg); });
        }
        events.push({
          ...common,
          start, end: Parser.parseDate(fm.end_year),
          displayText: mainBody,
          summary,
          rulers
        });

        // 细节条目："## 时间线"下带年份的行，作为主事件之外的额外补充，各自年份独立参与匹配
        const { items: timelineLines, skipped: evSkipped } = Parser.parseTimelineSection(body, '时间线');
        evSkipped.forEach(line=>{ warnings.push(title+'：「## 时间线」里有一行没识别出年份，已跳过——'+line); });
        timelineLines.forEach(t=>{
          events.push({
            ...common,
            keyEra: '',   // 细节条目不重复背进度条，进度条已经由主事件承担
            start: { year:t.year, month:t.month, day:t.day },
            end: t.endYear!=null ? { year:t.endYear, month:null, day:null } : null,
            displayText: t.datePrefix + t.rest
          });
        });
      } else if(fm.type === 'entity'){
        const { items: entityTimeline, skipped: enSkipped } = Parser.parseTimelineSection(body, '时间线');
        enSkipped.forEach(line=>{ warnings.push(title+'：「## 时间线」里有一行没识别出年份，已跳过——'+line); });
        const { items: fictionalTimeline, skipped: ftSkipped } = Parser.parseTimelineSection(body, '小说时间线');
        ftSkipped.forEach(line=>{ warnings.push(title+'：「## 小说时间线」里有一行没识别出年份，已跳过——'+line); });
        persons.push({
          title, path,
          birth: Parser.parseDate(fm.start_year),
          death: Parser.parseDate(fm.end_year),
          timeNote: fm.time_note || '',
          country: Parser.toArr(fm.region_country).map(Parser.normalizeCountry),
          domain: Parser.toArr(fm.domain),
          carrier: fm.carrier || '',
          related: Parser.toArr(fm.related),
          fictional: Parser.isTrue(fm.is_fictional),
          coverageStart: Parser.parseDate(fm.coverage_start),
          coverageEnd: Parser.parseDate(fm.coverage_end),
          body,
          timeline: entityTimeline,
          fictionalTimeline: fictionalTimeline
        });
      }
    }

    // event 与 entity 的关联：不再用 subject 字段，改成扫正文里的 [[双链]]，
    // 只认能对上 entity 标题名单的链接；第一个算主时间线，之后的算"相关提及"。
    const entityTitles = new Set(persons.map(p=>p.title));
    events.forEach(e=>{
      const links = Parser.extractWikilinks(e.body).filter(name=> entityTitles.has(name));
      if(links.length){
        e.mainEntity = links[0];
        e.mentionedEntities = [...new Set(links.slice(1))].filter(n=>n!==links[0]);
      }
    });

    // entity 正文"## 时间线"里逐行记的节点，之前只喂给了主体看板，
    // 地图这边（时间看板）点某国某年是完全看不到的——这里把它们也转成
    // 跟独立 event 笔记同等地位的"事件"，domain/carrier/region/is_fictional
    // 全部继承所在 entity 的 frontmatter，年份/国家匹配就能正常命中。
    persons.forEach(p=>{
      (p.timeline||[]).forEach(t=>{
        events.push({
          title: t.fullText,
          displayText: t.datePrefix + p.title + t.rest,   // 例：1881年9月25日 + 鲁迅 + 出生于浙江省绍兴府城里
          path: p.path,
          start: { year: t.year, month: t.month, day: t.day },
          end: t.endYear!=null ? { year: t.endYear, month:null, day:null } : null,
          keyEra: '',
          timeNote: '',
          region: p.country,
          domain: p.domain,
          carrier: p.carrier,
          related: [],
          topic: [],
          fictional: p.fictional,
          body: '',
          mainEntity: p.title,
          mentionedEntities: [],
          fromEntityTimeline: true
        });
      });
    });

    // "## 小说时间线"：作品虚构内容里逐年提到的节点，混进政治/经济/文化/其他分组正常展示，
    // 靠强制 fictional:true 触发"· 虚构"标签跟真实内容区分，不插入书名/实体名
    // （写虚构时间线时句子本来就会自己带主语，插了反而重复）。
    persons.forEach(p=>{
      (p.fictionalTimeline||[]).forEach(t=>{
        events.push({
          title: t.fullText,
          displayText: t.datePrefix + t.rest,
          path: p.path,
          start: { year: t.year, month: t.month, day: t.day },
          end: t.endYear!=null ? { year: t.endYear, month:null, day:null } : null,
          keyEra: '',
          timeNote: '',
          region: p.country,
          domain: p.domain,
          carrier: p.carrier,
          related: [],
          topic: [],
          fictional: true,   // 强制虚构，不看 entity 的 is_fictional
          body: '',
          mainEntity: p.title,
          mentionedEntities: [],
          fromFictionalTimeline: true
        });
      });
    });

    // domain / carrier 不再要求 tag-registry 笔记里手动列全：
    // 只要某个 event/entity 笔记用到了新的 domain 或 carrier 取值，
    // 这里都会自动补进 tagRegistry，配色和分组不会因为漏登记而找不到对应项。
    // 显示顺序仍以 tag-registry 手动登记的排列为准，自动补录只追加在末尾兜底。
    const seenDomain = new Set(tagRegistry.domain);
    const seenCarrier = new Set(tagRegistry.carrier);
    [...events, ...persons].forEach(item=>{
      (item.domain||[]).forEach(d=>{ if(d && !seenDomain.has(d)){ seenDomain.add(d); tagRegistry.domain.push(d); } });
      if(item.carrier && !seenCarrier.has(item.carrier)){ seenCarrier.add(item.carrier); tagRegistry.carrier.push(item.carrier); }
    });

    // 国家名兜底提醒：region_country 里的值，经过中英文别名转换后
    // 如果还是在 COUNTRY_CONTINENT 里找不到，说明这个国家彻底没登记过——
    // 不会报错、但会在地图上"静默消失"，这里先汇总提醒，而不是等你自己发现少了数据。
    events.forEach(e=>{
      (e.region||[]).forEach(r=>{ if(!COUNTRY_CONTINENT[r]) warnings.push(e.title+'：国家「'+r+'」未登记，不会显示在地图上'); });
    });
    persons.forEach(p=>{
      (p.country||[]).forEach(r=>{ if(!COUNTRY_CONTINENT[r]) warnings.push(p.title+'：国家「'+r+'」未登记，不会显示在地图上'); });
    });

    return { events, persons, tagRegistry, warnings };
  }
};

/* =========================================================
   3. Color —— 大洲底色 -> 领域色阶
   ========================================================= */
const Color = {
  hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h,s,l=(max+min)/2;
    if(max===min){ h=s=0; }
    else{
      const d=max-min;
      s = l>0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case r: h=(g-b)/d + (g<b?6:0); break;
        case g: h=(b-r)/d + 2; break;
        case b: h=(r-g)/d + 4; break;
      }
      h/=6;
    }
    return [h*360, s*100, l*100];
  },
  hslToHex(h,s,l){
    s/=100; l/=100;
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
    let r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0');
    return '#'+toHex(r)+toHex(g)+toHex(b);
  },
  domainShadeMap(continent){
    const domains = Store.vault.tagRegistry.domain.length ? Store.vault.tagRegistry.domain : DEFAULT_DOMAINS;
    const [h,s] = Color.hexToHsl(CONTINENT_HEX[continent] || '#8A8578');
    const map = {};
    domains.forEach((d,i)=>{
      const t = domains.length>1 ? i/(domains.length-1) : 0;
      const l = 30 + t*42;
      map[d] = Color.hslToHex(h, Math.max(s,35), l);
    });
    map['__default'] = Color.hslToHex(h, Math.max(s,35), 45);
    return map;
  }
};

/* =========================================================
   4. Store —— 唯一的可变状态容器
   ---------------------------------------------------------
   原来分散在全局的 VAULT / currentYear / yearMin / yearMax /
   selectedScope / pendingRestoreHandle 全部收进这一个对象。
   好处：想知道"这个应用有哪些会变的状态"，看这一处就够了；
   新增状态时也加在这里，不再随手声明新的裸露全局变量。
   ========================================================= */
const Store = {
  vault: { events:[], persons:[], tagRegistry:{domain:DEFAULT_DOMAINS, carrier:[], countryMain:[], countrySecondary:[]}, warnings:[] },
  currentYear: (function(){
    const saved = parseInt(localStorage.getItem('fwb_lastYear'), 10);
    return Number.isFinite(saved) ? saved : 1938;
  })(),
  yearMin: 1850,
  yearMax: 1950,
  selectedScope: null, // {type:'continent'|'country'|'other', continent, country}
  pendingRestoreHandle: null, // App.tryRestore 发现"存过但权限过期"的句柄时，暂存在这里等按钮点击
  // 地图/分栏，记住你上次实际点的是哪个，不是一个要手动配置的"默认值"开关——
  // 跟 currentYear 是同一套持久化模式，跟着你最后一次操作走
  lastView: (localStorage.getItem('fwb_lastView') === 'columns') ? 'columns' : 'map'
};

/* =========================================================
   5. Utils —— 无状态小工具
   ========================================================= */
const Utils = {
  escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  inRange(startObj, endObj, year){
    if(!startObj) return false;
    const s = startObj.year;
    const e = endObj ? endObj.year : s;
    return year>=s && year<=e;
  }
};

/* =========================================================
   6. Query —— 按 scope（大洲/国家/其他）+ 年份 查事件、查背景作品
   ---------------------------------------------------------
   地图弹窗、抽屉、分栏三处都通过 Query.getScopeEvents 取数据，
   保证三处内容永远互相对得上，不会因为各自查各自的而出现分歧。
   ========================================================= */
const Query = {
  eventsForCountryYear(country, year){
    return Store.vault.events.filter(e=> e.region.includes(country) && Utils.inRange(e.start, e.end, year));
  },
  eventsForContinentYear(continent, year){
    const countries = COUNTRIES_BY_CONTINENT[continent] || [];
    return Store.vault.events.filter(e=> e.region.some(r=>countries.includes(r)) && Utils.inRange(e.start, e.end, year));
  },
  /* coverage_start/coverage_end：作品类 entity 描绘的背景年代，跟"这一年真实/虚构发生了什么"分开查——
     不走 bgEvents（跨度事件进度条）那条路，因为同一年覆盖到的作品数量可能很多（比如法国大革命），
     硬塞进只为"国运级大事"设计的进度条/两两配对排布里会挤爆，所以单独查、单独展示成 chip 墙。 */
  coverageEntitiesForCountryYear(country, year){
    return Store.vault.persons.filter(p=> p.coverageStart && Utils.inRange(p.coverageStart, p.coverageEnd, year) && p.country.includes(country));
  },
  coverageEntitiesForContinentYear(continent, year){
    const countries = COUNTRIES_BY_CONTINENT[continent] || [];
    return Store.vault.persons.filter(p=> p.coverageStart && Utils.inRange(p.coverageStart, p.coverageEnd, year) && p.country.some(r=>countries.includes(r)));
  },
  /* 按 scope 取当年数据，地图弹窗和分栏表头共用同一份，保证内容不会两边对不上。
     换成真实国家轮廓之后，每个已登记国家都有自己独立可点的形状，不再需要"其他"这个
     兜底分类（以前是给"没有专属图钉的国家"准备的）——点击未登记的背景国家，
     直接按大洲聚合展示（走 type:'continent' 这条路），逻辑更简单也更统一。 */
  getScopeEvents(scope){
    let evs=[], bgEvents=[], coverageItems=[];
    if(scope.type==='continent'){
      evs = Query.eventsForContinentYear(scope.continent, Store.currentYear);
      bgEvents = evs.filter(e=>e.keyEra==='National').sort((a,b)=>a.start.year-b.start.year);
      coverageItems = Query.coverageEntitiesForContinentYear(scope.continent, Store.currentYear);
    } else if(scope.type==='country'){
      evs = Query.eventsForCountryYear(scope.country, Store.currentYear);
      bgEvents = evs.filter(e=>e.keyEra==='National').sort((a,b)=>a.start.year-b.start.year);
      coverageItems = Query.coverageEntitiesForCountryYear(scope.country, Store.currentYear);
    }
    return { evs, bgEvents, coverageItems };
  }
};

/* =========================================================
   7. DetailView —— 把 Query 的结果拼成 HTML
   ---------------------------------------------------------
   地图弹窗（MapView）、右侧抽屉（MapView）、常驻分栏（ColumnBoard）
   三处最终展示的"某国/某洲某年发生了什么"内容，全部由这里统一拼装，
   避免同一段 HTML 结构在三个地方各写一份、改一处忘一处。
   ========================================================= */
/* 分栏专用：固定顺序展示，方便几栏之间对齐比较——
   跨度事件(National) → 政治(含军事) → 经济 → 文化 → 其他，没有对应内容也留空占位，
   不像地图弹窗那样"有什么显示什么、顺序随数据变化"。数据源仍是 Query.getScopeEvents，跟地图内容一致。 */
const FIXED_DOMAIN_ROWS = [
  { label:'政治', match: d => d==='政治' || d==='军事' },
  { label:'经济', match: d => d==='经济' },
  { label:'文化', match: d => d==='文化' },
];

const DetailView = {

  /* coverage_start/coverage_end 的作品，展示成 chip 墙——数量不设上限，flex-wrap 自然换行，
     容器固定两行高度、超出内部滚动。只显示书名，年代区间 + 简述放进 data-* 属性，
     悬浮时由全局共用的 .chip-tooltip 读取展示（不能用 CSS :hover 挂在 chip 自己身上，
     会被 .coverage-chips 的 overflow:auto 裁掉，见上面 CSS 注释）。
     wrapperClass：分栏传 'col-slot'（复用政治/经济那套外壳，包括"最后一个不显示底边框"的规则），
     地图弹窗传 'domain-group'（跟真实 domain 分组外层结构一致）——标签固定叫"背景"，
     颜色用中性弱化色（不用国家/domain 主题色），跟这块内容本身的"弱化"定位对上。 */
  renderCoverageChips(coverageItems, wrapperClass){
    const chips = coverageItems.map(p=>{
      const s = p.coverageStart.year, e = p.coverageEnd ? p.coverageEnd.year : '?';
      const summary = Parser.extractSection(p.body, '简述');
      return `<div class="coverage-chip" tabindex="0"
        data-range="${Utils.escapeHtml(s + ' – ' + e)}"
        data-summary="${summary ? Utils.escapeHtml(Parser.stripWikilinkSyntax(summary)) : ''}">
        <span class="coverage-chip-name">${Utils.escapeHtml(p.title)}</span>
      </div>`;
    }).join('');
    // coverage-slot：单独一个修饰类，专门用来盖掉 wrapperClass（col-slot）自带的
    // min-height:176px——那是给政治/经济那几行做四栏对齐用的，这里只需要固定两行的高度，不需要那么高。
    // 不管有没有数据，容器永远是 .coverage-chips（height:64px 固定），
    // 不会因为换成 col-slot-empty 这种没有固定高度的占位而导致空的时候塌成一行。
    return `<div class="${wrapperClass} coverage-slot">
      <div class="coverage-chips">${chips}</div>
    </div>`;
  },

  /* 单条事件的卡片 HTML：分栏(columnBodyHtml，2处) 和 地图弹窗/抽屉(detailBodyHtml，1处)
     原来是各写各的，一模一样的结构抄了三遍——抽成共用方法，以后要改这张卡片的样式
     （加点击跳转、调间距……）只用改这一处，三个视图自动同步。 */
  renderEventRow(e, color){
    return `<div class="event-row" style="border-color:${color}">
      <span class="ev-title">${Utils.escapeHtml(Parser.stripWikilinkSyntax(e.displayText))}</span>
      ${e.fictional?' <span class="ev-fiction">· 虚构</span>':''}
    </div>`;
  },

  columnBodyHtml(scope, bgOverride){
    const color = CONTINENT_HEX[scope.continent];
    const { evs, bgEvents: rawBg, coverageItems } = Query.getScopeEvents(scope);
    const bgEvents = bgOverride !== undefined ? bgOverride : rawBg;
    const shades = Color.domainShadeMap(scope.continent);
    let html = '';

    html += `<div class="col-slot col-slot-span">`;
    if(bgEvents.length){
      // 按年份顺序两两配对：第1、2条一行，第3、4条一行……凑不满的最后一个独占一行
      const rows = [];
      for(let k=0; k<bgEvents.length; k+=2){
        rows.push(k+1 < bgEvents.length ? [bgEvents[k], bgEvents[k+1]] : [bgEvents[k]]);
      }
      html += rows.map(row =>
        row.length === 2
          ? `<div class="bg-split">${row.map(bg=>DetailView.renderBgItem(bg, color)).join('')}</div>`
          : DetailView.renderBgItem(row[0], color)
      ).join('');
    } else {
      html += `<div class="col-slot-empty"></div>`;
    }
    html += `</div>`;

    const used = new Set();
    const visibleEvs = evs.filter(e=>e.displayText);
    FIXED_DOMAIN_ROWS.forEach(row=>{
      const list = visibleEvs.filter(e => e.domain.some(row.match));
      list.forEach(e=>used.add(e));
      const c = shades[row.label] || shades['__default'];
      html += `<div class="col-slot">
        <div class="domain-tag" style="background:${c}22;color:${c}">${row.label}</div>
        <div class="col-slot-content">`;
      html += list.length
        ? list.map(e=>DetailView.renderEventRow(e, c)).join('')
        : `<div class="col-slot-empty"></div>`;
      html += `</div></div>`;
    });

    const others = visibleEvs.filter(e=> !used.has(e));
    const oc = shades['未分类'] || shades['__default'];
    html += `<div class="col-slot">
      <div class="domain-tag" style="background:${oc}22;color:${oc}">其他</div>
      <div class="col-slot-content">`;
    html += others.length
      ? others.map(e=>DetailView.renderEventRow(e, oc)).join('')
      : `<div class="col-slot-empty"></div>`;
    html += `</div></div>`;

    html += DetailView.renderCoverageChips(coverageItems, 'col-slot');

    return html;
  },

  /* 跨度事件进度条：地图弹窗和分栏共用同一份，避免两处各写一次容易漏改 */
  /* 找出某个跨度事件在"当前年份"对应的在位者：每条记录自带明确的 [start,end]
     区间，直接找当前年份落在哪一条里就行，不用再靠"下一条出现"去反推——
     这也是这次改格式的原因，旧写法（只记继位年份）没法表达"这位到底当了
     多少年"，全靠猜下一位；现在起止写死了，谁的锅一目了然。
     如果因为年份打错导致两条区间重叠（parseRulerSection 那边已经会警告这种情况），
     这里简单取第一个匹配到的，不做特殊容错——既然已经报了警告，让它显示出来
     反而更容易被发现去修，掩盖掉不会真的解决问题。 */
  currentRulerFor(bg){
    if(!bg.rulers || !bg.rulers.length) return null;
    return bg.rulers.find(r => Store.currentYear >= r.start && Store.currentYear <= r.end) || null;
  },

  renderBgItem(bg, color){
    const s = bg.start.year, e = (bg.end ? bg.end.year : s);
    const pos = e>s ? Math.min(Math.max((Store.currentYear-s)/(e-s),0),1)*100 : 50;
    const info = bg.summary
      ? `<div class="bg-info" tabindex="0">
          <span class="bg-info-icon">!</span>
          <div class="bg-tooltip">${Utils.escapeHtml(Parser.stripWikilinkSyntax(bg.summary))}</div>
        </div>`
      : '';
    // "现在在位"：常驻显示在名字旁边，跟着年份滑动自动换人，不需要额外悬浮一次——
    // 跟上面 info（固定不变的朝代简述）是两种性质的信息，特意不挤进同一个悬浮框里，
    // 见跟用户讨论时定下的设计。
    const ruler = DetailView.currentRulerFor(bg);
    // 不用 "·" 分隔、不用文字前缀，直接"XX在位"；跟朝代信息之间的间隔用
    // .bg-ruler 自己的 margin-left 做真正的 CSS 呼吸空间，不是拿空格符号硬凑
    const rulerLabel = ruler ? `<span class="bg-ruler">${Utils.escapeHtml(Parser.stripWikilinkSyntax(ruler.name))}在位</span>` : '';
    return `<div class="bg-item">
      <div class="bg-track" style="background:${color}2E">
        <div class="bg-name">${Utils.escapeHtml(bg.title)}（${s} – ${e}）${rulerLabel}</div>
        <div class="bg-dot" style="left:${pos}%;background:${color}"></div>
        ${info}
      </div>
    </div>`;
  },

  detailBodyHtml(scope){
    const color = CONTINENT_HEX[scope.continent];
    const { evs, bgEvents, coverageItems } = Query.getScopeEvents(scope);

    const shades = Color.domainShadeMap(scope.continent);
    let html = '';

    if(bgEvents.length){
      html += `<div class="bg-progress">${bgEvents.map(bg=>DetailView.renderBgItem(bg, color)).join('')}</div>`;
    }

    if(!evs.length && !bgEvents.length){
      html += `<div class="detail-empty">这一年，暂无相关记录</div>`;
    } else if(evs.length){
      const groups = {};
      evs.filter(e=>e.displayText).forEach(e=>{
        const doms = e.domain.length? e.domain : ['未分类'];
        doms.forEach(d=>{ (groups[d]=groups[d]||[]).push(e); });
      });
      Object.entries(groups).forEach(([dom, list])=>{
        const c = shades[dom] || shades['__default'];
        html += `<div class="domain-group"><div class="domain-tag" style="background:${c}22;color:${c}">${Utils.escapeHtml(dom)}</div>`;
        list.forEach(e=>{
          html += DetailView.renderEventRow(e, c);
        });
        html += `</div>`;
      });
    }
    html += DetailView.renderCoverageChips(coverageItems, 'domain-group');
    return html;
  },

  /* 统一组装弹窗标题+正文。换成真实国家轮廓之后，每个国家都是独立可点的形状，
     不会再像手绘图钉那样挤在一起互相遮挡——原来"密集聚类合并成一张卡"的特殊处理
     不再需要，统一走单卡逻辑即可。 */
  popoverContentFor(scope){
    const color = CONTINENT_HEX[scope.continent];
    const title = scope.type==='continent' ? CONTINENT_NAME_CN[scope.continent] : scope.country;
    return { title, bodyHtml: DetailView.detailBodyHtml(scope), color };
  }
};

/* =========================================================
   8. MapView —— 地图 SVG 构建、国家轮廓状态、弹窗定位、抽屉开关
   ---------------------------------------------------------
   从"大洲色块 + 图钉"换成了"每个国家自己的真实轮廓"：
   已登记国家 = 按大洲上色、可点、弹出悬浮卡；
   未登记的背景国家 = 中性灰色，点击按所在大洲打开右侧"其他"抽屉
   （这就顶替了原来专门画在地图边角的"其他"图钉——现在背景色块
   本身就是这个入口，不用再单独找个位置画点）。
   ========================================================= */
const MapView = {

  buildMap(){
    const svg = document.getElementById('mapSvg');
    svg.innerHTML='';

    // 背景/未登记国家先画（在下层），已登记国家后画（在上层、盖在背景之上），
    // 避免已登记国家的描边被背景国家的填充盖住
    const registeredNames = [], backgroundNames = [];
    Object.keys(COUNTRY_PATHS).forEach(name=>{
      (COUNTRY_CONTINENT[name] ? registeredNames : backgroundNames).push(name);
    });

    backgroundNames.forEach(name=>{
      const d = COUNTRY_PATHS[name];
      const continent = COUNTRY_CONTINENT_ALL[name] || 'Asia';
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('class','country bg');
      path.dataset.continent = continent;
      path.addEventListener('click', (ev)=>{ ev.stopPropagation(); MapView.openDrawer({type:'continent', continent}); });
      svg.appendChild(path);
    });

    registeredNames.forEach(name=>{
      const d = COUNTRY_PATHS[name];
      const continent = COUNTRY_CONTINENT[name];
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('class','country registered');
      path.setAttribute('fill', CONTINENT_HEX[continent]);
      path.dataset.country = name;
      path.dataset.continent = continent;
      path.addEventListener('click', (ev)=>{ ev.stopPropagation(); MapView.selectScope({type:'country', continent, country:name}); });
      svg.appendChild(path);
    });

    // 新加坡：110m 精度数据集里太小、没有独立的真实轮廓，退回一个小圆点兜底，
    // 保证它依然可点、依然在地图上找得到，不会因为数据缺失直接从地图上消失
    if(!COUNTRY_PATHS['Singapore'] && COUNTRY_REAL_POS['Singapore']){
      const [x,y] = COUNTRY_REAL_POS['Singapore'];
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('r',3.5);
      dot.setAttribute('class','country registered fallback-dot');
      dot.setAttribute('fill', CONTINENT_HEX['Asia']);
      dot.dataset.country = 'Singapore';
      dot.dataset.continent = 'Asia';
      dot.addEventListener('click', (ev)=>{ ev.stopPropagation(); MapView.selectScope({type:'country', continent:'Asia', country:'Singapore'}); });
      svg.appendChild(dot);
    }
  },

  renderMapCountries(){
    document.querySelectorAll('.country.registered').forEach(el=>{
      const country = el.dataset.country;
      const count = Query.eventsForCountryYear(country, Store.currentYear).length;
      el.classList.toggle('dim', count===0);
    });
  },

  /* 已登记国家：直接在地图上锚定（用国家真实几何重心当锚点）弹出悬浮卡 */
  selectScope(scope){
    Store.selectedScope = scope;
    document.querySelectorAll('.country.registered').forEach(p=>p.classList.remove('active'));
    const target = document.querySelector(`.country.registered[data-country="${CSS.escape(scope.country)}"]`);
    if(target) target.classList.add('active');

    const content = DetailView.popoverContentFor(scope);
    const stage = document.getElementById('mapStage');
    let pop = document.getElementById('mapPopover');
    if(pop) pop.remove();
    pop = document.createElement('div');
    pop.id = 'mapPopover';
    pop.className = 'popover';

    pop.innerHTML = `<button class="popover-close" aria-label="关闭">×</button>
      <div class="detail-head"><span class="detail-swatch" style="background:${content.color}"></span><span class="detail-title">${Utils.escapeHtml(content.title)}</span></div>
      ${content.bodyHtml}`;

    stage.appendChild(pop);

    // 定位：以 viewBox 1000x420 为基准换算成百分比，锚在该国真实几何重心旁
    const anchorXY = COUNTRY_REAL_POS[scope.country] || [500, 210];
    const [ax, ay] = anchorXY;
    let leftPct = (ax/1000)*100;
    const flip = leftPct > 60; // 避免弹出卡片超出右边界：锚点靠右半边就往左长
    pop.style.top = ((ay/420)*100) + '%';
    if(flip){
      pop.style.left = 'auto';
      pop.style.right = (100 - leftPct) + '%';
      pop.style.transform = 'translate(12px, -10%)';
    } else {
      pop.style.left = leftPct + '%';
      pop.style.transform = 'translate(18px, -10%)';
    }

    pop.querySelector('.popover-close').addEventListener('click', (e)=>{
      e.stopPropagation();
      pop.remove();
      Store.selectedScope=null;
      document.querySelectorAll('.country.registered').forEach(p=>p.classList.remove('active'));
    });
  },

  /* 未登记/背景国家：点击后按所在大洲打开右侧抽屉，展示该大洲当年的整体情况 */
  openDrawer(scope){
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('drawerBackdrop');
    const body = document.getElementById('drawerBody');
    const color = CONTINENT_HEX[scope.continent];
    const title = CONTINENT_NAME_CN[scope.continent];
    body.innerHTML = `<div class="detail-head"><span class="detail-swatch" style="background:${color}"></span><span class="detail-title">${Utils.escapeHtml(title)}</span></div>${DetailView.detailBodyHtml(scope)}`;
    drawer.classList.add('show');
    backdrop.classList.add('show');
    drawer.dataset.continent = scope.continent;
  },
  closeDrawer(){
    document.getElementById('drawer').classList.remove('show');
    document.getElementById('drawerBackdrop').classList.remove('show');
  }
};

/* =========================================================
   9. ColumnBoard —— 分栏视图（常驻四栏，复用 DetailView）
   ========================================================= */
const ColumnBoard = {
  /* 常驻四列，不用点击。第一列大洲、后三列具体国家，都是复用 DetailView.columnBodyHtml */
  DEFS: [
    { scope:{type:'continent', continent:'Europe'}, label:'EU', color:CONTINENT_HEX.Europe },
    { scope:{type:'country', continent:'Asia', country:'China'}, label:'CN', color:CONTINENT_HEX.Asia },
    { scope:{type:'country', continent:'Asia', country:'Japan'}, label:'JP', color:CONTINENT_HEX.Asia },
    { scope:{type:'country', continent:'Americas', country:'US'}, label:'US', color:CONTINENT_HEX.Americas },
  ],

  render(){
    const el = document.getElementById('columnBoard');
    if(!el) return;
    el.innerHTML = ColumnBoard.DEFS.map(col => {
      const { bgEvents } = Query.getScopeEvents(col.scope);  // 已按 start.year 从旧到新排好序
      // 3条及以上：最早的一条挪到标题行显示（国家名后面）；剩下的按"次早配最新、第三早配次新"
      // 从两端往中间配对，凑不成对的最后一个独自占一整行。1/2条维持原位置不变。
      let headerBar = '';
      let bodyBgEvents = bgEvents;
      if(bgEvents.length >= 3){
        headerBar = `<div class="col-head-bar">${DetailView.renderBgItem(bgEvents[0], col.color)}</div>`;
        bodyBgEvents = bgEvents.slice(1);
      }

      return `
      <div class="col-card">
        <div class="col-head">
          <span class="col-swatch" style="background:${col.color}"></span>
          <span class="col-title">${Utils.escapeHtml(col.label)}</span>
          ${headerBar}
        </div>
        ${DetailView.columnBodyHtml(col.scope, bodyBgEvents)}
      </div>
    `;
    }).join('');
  }
};

/* =========================================================
   10. CompareView —— 主体看板（双人对比时间线）
   ========================================================= */
const CompareView = {

  buildPersonList(){
    const dl = document.getElementById('personList');
    dl.innerHTML = Store.vault.persons.map(p=>`<option value="${Utils.escapeHtml(p.title)}">`).join('');
  },

  buildTimelineFor(person){
    if(!person) return null;
    const items = [];
    // start_year/end_year 只作年份锚点（排序、年份轴匹配用），不再自动生成"出生/逝世"这两条展示项——
    // 这件事完全交给你正文"## 时间线"自己叙述，避免两边各写一次重复。
    (person.timeline||[]).forEach(t=>{
      items.push({year:t.year, title:t.fullText, fictional:person.fictional});
    });
    // 独立 event 笔记：正文第一个 [[双链]] 指回这个 entity 的，算主时间线
    // （排除刚才由这个 entity 自己正文时间线合成出的事件，那些已经从 person.timeline 里算过一次了）
    Store.vault.events.filter(e=> e.mainEntity === person.title && !e.fromEntityTimeline).forEach(e=>{
      if(e.start) items.push({year:e.start.year, title:e.displayText, fictional:e.fictional});
    });
    items.sort((a,b)=>a.year-b.year);
    return items;
  },

  /* 正文里链接顺序在这个 entity 之后出现（不是主角）的独立事件，弱化展示，不进主时间线 */
  mentionedEventsFor(person){
    if(!person) return [];
    return Store.vault.events.filter(e=> (e.mentionedEntities||[]).includes(person.title) && e.start)
      .sort((a,b)=>a.start.year-b.start.year);
  },

  render(){
    const grid = document.getElementById('compareGrid');
    const nameA = document.getElementById('subjectA').value.trim();
    const nameB = document.getElementById('subjectB').value.trim();
    const pA = Store.vault.persons.find(p=>p.title===nameA);
    const pB = Store.vault.persons.find(p=>p.title===nameB);
    grid.innerHTML = CompareView.renderCol(pA, nameA, 'A') + CompareView.renderCol(pB, nameB, 'B');
    grid.querySelectorAll('.related-chip-link').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const otherInput = document.getElementById(chip.dataset.side==='A' ? 'subjectB' : 'subjectA');
        otherInput.value = chip.dataset.name;
        CompareView.render();
      });
    });
  },

  renderCol(person, typedName, side){
    if(!person){
      const msg = typedName ? '没找到叫这个名字的人物笔记' : '选一个主体';
      return `<div class="compare-col"><div class="detail-empty">${Utils.escapeHtml(msg)}</div></div>`;
    }
    const items = CompareView.buildTimelineFor(person);
    const span = (person.birth?person.birth.year:'?') + ' – ' + (person.death?person.death.year:'…');
    let html = `<div class="compare-col">
      <div class="compare-name">${Utils.escapeHtml(person.title)}</div>
      <div class="compare-span mono">${span}</div>`;
    // 简介：只有"人"（carrier=人物/统治者）才展示——其它类型的 entity 时间线条目太多，
    // 不适合在这里配一段简介，它们的简介走"!"悬浮图标（另外处理）。
    if(PERSON_CARRIERS.includes(person.carrier)){
      const summary = Parser.extractSection(person.body, '简述');
      if(summary) html += `<div class="compare-summary">${Utils.escapeHtml(summary)}</div>`;
    }
    items.forEach(it=>{
      const age = person.birth ? (it.year - person.birth.year) : null;
      html += `<div class="tl-item">
        <div class="tl-age">${age!==null? age+'岁':''}</div>
        <div class="tl-body"><div class="tl-year mono">${it.year}</div>
        <div class="tl-title">${Utils.escapeHtml(Parser.stripWikilinkSyntax(it.title))}${it.fictional?' <span class="ev-fiction">· 虚构</span>':''}</div></div>
      </div>`;
    });
    const mentioned = CompareView.mentionedEventsFor(person);
    if(mentioned.length){
      html += `<div class="mentioned-group">
        <div class="mentioned-head">相关提及</div>`;
      mentioned.forEach(e=>{
        html += `<div class="mentioned-row">
          <span class="mentioned-title">${Utils.escapeHtml(Parser.stripWikilinkSyntax(e.displayText))}</span>
          ${e.fictional?' <span class="ev-fiction">· 虚构</span>':''}
        </div>`;
      });
      html += `</div>`;
    }
    // related：笔记 frontmatter 里手动登记的关联对象，不限 entity/event。
    // 能在 Store.vault.persons 里查到的，做成可点击 chip——点一下顺着关系链把它设成对比的另一栏；
    // 查不到（多半是 event，或者写错名字）的，展示成纯文字，暂时没有可跳转的落点。
    if((person.related||[]).length){
      html += `<div class="related-group">
        <div class="related-head">相关</div>
        <div class="related-chips">`;
      person.related.forEach(name=>{
        const isEntity = Store.vault.persons.some(p=>p.title===name);
        html += isEntity
          ? `<span class="related-chip related-chip-link" data-side="${side}" data-name="${Utils.escapeHtml(name)}">${Utils.escapeHtml(name)}</span>`
          : `<span class="related-chip">${Utils.escapeHtml(name)}</span>`;
      });
      html += `</div></div>`;
    }
    html += `</div>`;
    return html;
  }
};

/* =========================================================
   11. ChipTooltip —— coverage chip 悬浮详情
   ---------------------------------------------------------
   全局共用一个 tooltip 元素，用 JS 算坐标定位成 position:fixed，
   脱离 .coverage-chips 那个 overflow:auto 容器的裁剪范围。
   用事件委托挂在 document.body 上，因为 chip 是随年份滑动反复用 innerHTML 重绘的，
   没法对每个 chip 单独挂监听器（挂了也会在下次重绘时失效）。
   内容用 textContent 而不是拼字符串塞 innerHTML——dataset 读出来的是解码后的
   纯文本（比如 &lt; 会变回 <），如果再当 HTML 字符串拼接，遇到这种字符会被
   浏览器重新当成标签解析，等于绕过了 DetailView.renderCoverageChips 那边做的转义。
   ========================================================= */
const ChipTooltip = {
  show(chip){
    const tip = document.getElementById('chipTooltip');
    tip.innerHTML = '';
    const rangeEl = document.createElement('div');
    rangeEl.className = 'chip-tooltip-range';
    rangeEl.textContent = chip.dataset.range || '';
    tip.appendChild(rangeEl);
    if(chip.dataset.summary){
      const sumEl = document.createElement('div');
      sumEl.className = 'chip-tooltip-summary';
      sumEl.textContent = chip.dataset.summary;
      tip.appendChild(sumEl);
    }
    tip.classList.add('show');
    const rect = chip.getBoundingClientRect();
    const tipRect = tip.getBoundingClientRect();
    let left = Math.min(rect.left, window.innerWidth - tipRect.width - 10);
    left = Math.max(left, 10);
    let top = rect.top - tipRect.height - 8;
    if(top < 10) top = rect.bottom + 8; // 顶部空间不够就翻到 chip 下方显示
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  },
  /* 跟上面的 show() 不同：这个不依赖某个具体 DOM 元素的位置（比如年份滑块上的
     Global 色段是 pointer-events:none 的，没法直接悬停在它身上触发），
     而是直接按传入的鼠标坐标定位——给"鼠标移到轨道上，实时算这一年落在哪个
     色段里"这种场景用（见 App.init() 里 yearSlider 的 mousemove 监听）。
     text 传多条（数组）时纵向堆叠展示，用于同一年可能命中多个 Global 事件的情况。 */
  showAt(x, y, texts){
    const tip = document.getElementById('chipTooltip');
    tip.innerHTML = '';
    // 这里跟 show() 不一样：不用 .chip-tooltip-range 那个弱化灰色类——
    // 那个类是给"次要信息"（比如作品的年代区间）准备的，故意调暗了颜色。
    // 这里显示的是 Global 事件标题本身，是主要信息，直接继承 .chip-tooltip
    // 容器自带的高对比色（浅色字配深色底）就行，不需要额外弱化。
    texts.forEach(t=>{
      const el = document.createElement('div');
      el.className = 'chip-tooltip-title';
      el.textContent = t;
      tip.appendChild(el);
    });
    tip.classList.add('show');
    const tipRect = tip.getBoundingClientRect();
    let left = Math.min(x - tipRect.width/2, window.innerWidth - tipRect.width - 10);
    left = Math.max(left, 10);
    let top = y - tipRect.height - 14;
    if(top < 10) top = y + 18; // 顶部空间不够就翻到鼠标下方显示
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  },
  hide(){
    document.getElementById('chipTooltip').classList.remove('show');
  }
};

/* =========================================================
   12. App —— 启动流程、连接 vault、年份轴、tabs、事件监听绑定
   ---------------------------------------------------------
   这是唯一允许直接操作页面级 DOM 结构（tabs/年份轴/连接按钮）、
   并在文件末尾调用 App.init() 启动整个应用的地方。新增一个
   面板/tab 时，事件绑定统一加在 App.init() 里，不要散落在别处。
   ========================================================= */
const App = {

  setConnected(on){
    document.getElementById('connDot').classList.toggle('on', on);
    document.getElementById('connText').textContent = on ? 'F WORLD B 已连接' : '未连接仓库';
    document.getElementById('connectBtn').textContent = on ? '重新选择' : '选择 Vault 文件夹';
    ['timeEmpty','subjectEmpty'].forEach(id=> document.getElementById(id).style.display = on ? 'none' : 'block');
    ['timeContent','subjectContent'].forEach(id=> document.getElementById(id).style.display = on ? 'block' : 'none');
    App.updateViewSwitchVisibility();
  },

  renderWarnings(){
    const el = document.getElementById('warnStrip');
    if(Store.vault.warnings.length){
      el.style.display='block';
      el.textContent = `⚠ ${Store.vault.warnings.length} 条笔记有数据问题（悬停查看详情，不影响其余正常内容显示）`;
      el.title = Store.vault.warnings.join('\n');
    } else {
      el.style.display='none';
    }
  },

  async connectVault(handle){
    Store.vault = await Parser.scanVault(handle);
    App.renderWarnings();
    App.setConnected(true);
    App.computeYearRange();
    App.setupSlider();
    MapView.buildMap();
    App.renderYear();
    CompareView.buildPersonList();
    CompareView.render();
  },

  /* 地图/分栏 这两个 tab 现在跟"时间看板/主体看板"挤在同一行右对齐，
     但它只在"时间看板"被选中、且 vault 已连接（真的有内容可切换）时才该出现 */
  updateViewSwitchVisibility(){
    const timeActive = document.querySelector('.tab[data-tab="time"]').classList.contains('active');
    const connected = document.getElementById('timeContent').style.display !== 'none';
    document.getElementById('viewSwitch').style.display = (timeActive && connected) ? 'flex' : 'none';
  },

  computeYearRange(){
    let min=9999, max=-9999;
    [...Store.vault.events, ...Store.vault.persons].forEach(item=>{
      const s = item.start || item.birth;
      const e = item.end || item.death;
      if(s){ min=Math.min(min,s.year); max=Math.max(max,s.year); }
      if(e){ min=Math.min(min,e.year); max=Math.max(max,e.year); }
    });
    if(min<9999){ Store.yearMin = Math.floor(min/10)*10; Store.yearMax = Math.ceil(max/10)*10; }
    Store.currentYear = Math.min(Math.max(Store.currentYear, Store.yearMin), Store.yearMax);
  },

  setupSlider(){
    const slider = document.getElementById('yearSlider');
    slider.min = Store.yearMin; slider.max = Store.yearMax; slider.step = 1;
    slider.value = Store.currentYear;
    document.getElementById('yearInput').value = Store.currentYear;
    const ticks = document.getElementById('ticks');
    ticks.innerHTML='';
    const span = Store.yearMax-Store.yearMin;
    const step = span>200 ? 50 : span>80 ? 20 : 10;
    for(let y=Store.yearMin; y<=Store.yearMax; y+=step){
      const s = document.createElement('span'); s.textContent=y; ticks.appendChild(s);
    }
    App.renderGlobalTrack();
  },

  /* Global 跨度事件直接做进滑块轨道的颜色里（一条 linear-gradient，在对应年份区间
     切换成 --global 紫色），不额外叠加 DOM 元素——不会有任何东西盖在拖拽手柄上面，
     手柄的原生交互完全不受影响。轨道颜色实际画在 ::-webkit-slider-runnable-track
     这个伪元素上（见<style>），JS 只能通过设置 --slider-bg 这个自定义属性传值过去，
     没法直接 .style.background 到伪元素本身。
     yearMin/yearMax 一变（比如换了个 vault）就得重算一次色标位置，
     所以放在 setupSlider() 后面调用，不需要在切年份时重复执行。 */
  renderGlobalTrack(){
    const slider = document.getElementById('yearSlider');
    const span = Store.yearMax - Store.yearMin;
    const globals = Store.vault.events
      .filter(e=>e.keyEra==='Global' && e.start)
      .map(e=>({ start: e.start.year, end: e.end ? e.end.year : e.start.year }))
      .sort((a,b)=>a.start-b.start);

    if(!globals.length || span<=0){ slider.style.removeProperty('--slider-bg'); return; }

    // 合并重叠/相邻的区间——linear-gradient 的色标位置必须从左到右依次递增，
    // 如果两个 Global 事件年份有重叠，不合并的话色标会往回跳，渐变会错乱
    const merged = [];
    globals.forEach(g=>{
      const last = merged[merged.length-1];
      if(last && g.start <= last.end) last.end = Math.max(last.end, g.end);
      else merged.push({...g});
    });

    const MIN_WIDTH_PCT = 0.4; // 只跨一年这种极短区间，按比例算出来可能细到肉眼看不见，给个最小可见宽度
    const stops = [];
    let cursor = 0;
    merged.forEach(g=>{
      let left = ((g.start - Store.yearMin) / span) * 100;
      let right = ((g.end - Store.yearMin) / span) * 100;
      if(right - left < MIN_WIDTH_PCT) right = left + MIN_WIDTH_PCT;
      left = Math.max(left, cursor);
      right = Math.max(right, left);
      if(left > cursor) stops.push(`var(--line) ${cursor}%`, `var(--line) ${left}%`);
      stops.push(`var(--global) ${left}%`, `var(--global) ${right}%`);
      cursor = right;
    });
    if(cursor < 100) stops.push(`var(--line) ${cursor}%`, `var(--line) 100%`);

    // 颜色不能直接写 slider.style.background——真正显示颜色的是
    // ::-webkit-slider-runnable-track 这个伪元素，JS 没法直接操作伪元素的 style，
    // 只能设置外层 <input> 上的自定义属性，让伪元素的 CSS 规则(见<style>里的
    // background:var(--slider-bg, var(--line)))去读取这个值。
    slider.style.setProperty('--slider-bg', `linear-gradient(to right, ${stops.join(', ')})`);
  },

  renderYear(){
    try{ localStorage.setItem('fwb_lastYear', Store.currentYear); }catch(e){}
    document.getElementById('yearInput').value = Store.currentYear;
    App.renderGlobalBanner();
    MapView.renderMapCountries();
    const columnBoard = document.getElementById('columnBoard');
    if(columnBoard && columnBoard.style.display !== 'none') ColumnBoard.render();
    const pop = document.getElementById('mapPopover');
    if(Store.selectedScope && pop){
      const content = DetailView.popoverContentFor(Store.selectedScope);
      pop.className = 'popover';
      pop.innerHTML = `<button class="popover-close" aria-label="关闭">×</button>
        <div class="detail-head"><span class="detail-swatch" style="background:${content.color}"></span><span class="detail-title">${Utils.escapeHtml(content.title)}</span></div>
        ${content.bodyHtml}`;
      pop.querySelector('.popover-close').addEventListener('click', (e)=>{
        e.stopPropagation(); pop.remove(); Store.selectedScope=null;
        document.querySelectorAll('.country.registered').forEach(p=>p.classList.remove('active'));
      });
    }
    const drawer = document.getElementById('drawer');
    if(drawer.classList.contains('show') && drawer.dataset.continent){
      MapView.openDrawer({type:'continent', continent: drawer.dataset.continent});
    }
  },

  renderGlobalBanner(){
    const globals = Store.vault.events.filter(e=> e.keyEra==='Global' && Utils.inRange(e.start, e.end, Store.currentYear));
    const banner = document.getElementById('globalBanner');
    const chips = document.getElementById('globalChips');
    if(!globals.length){ banner.classList.remove('show'); return; }
    banner.classList.add('show');
    chips.innerHTML = globals.map(g=>`<div class="global-chip">${Utils.escapeHtml(g.title)}</div>`).join('');
  },

  /* 所有事件监听绑定的唯一入口，文件末尾调用一次。 */
  init(){
    document.getElementById('connectBtn').addEventListener('click', async ()=>{
      try{
        // 有存过的句柄、只是权限过期：只弹权限确认，不再弹选文件夹对话框
        if(Store.pendingRestoreHandle){
          const p = await Store.pendingRestoreHandle.requestPermission({mode:'read'});
          if(p==='granted'){ await App.connectVault(Store.pendingRestoreHandle); Store.pendingRestoreHandle = null; }
          return;
        }
        // 真正第一次连接 / 手动点"重新选择"：才弹原生选文件夹对话框
        const handle = await window.showDirectoryPicker();
        await Db.set('vaultHandle', handle);
        Store.pendingRestoreHandle = null;
        await App.connectVault(handle);
      }catch(e){ /* 用户取消选择，忽略 */ }
    });

    (async function tryRestore(){
      if(!('showDirectoryPicker' in window)){
        document.getElementById('connText').textContent = '此浏览器不支持本地文件读取，请用 Chrome/Edge 打开';
        document.getElementById('connectBtn').style.display='none';
        return;
      }
      try{
        const handle = await Db.get('vaultHandle');
        if(!handle) return;
        const perm = await handle.queryPermission({mode:'read'});
        if(perm === 'granted'){ await App.connectVault(handle); }
        else{
          Store.pendingRestoreHandle = handle;
          document.getElementById('connectBtn').textContent = '重新连接 F WORLD B';
        }
      }catch(e){
        console.warn('恢复上次连接的 vault 失败：', e);
      }
    })();

    // Tabs
    document.querySelectorAll('.tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
        App.updateViewSwitchVisibility();
      });
    });

    // 地图 / 分栏 切换
    document.querySelectorAll('.view-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const isColumns = tab.dataset.view === 'columns';
        document.getElementById('mapCardWrap').style.display = isColumns ? 'none' : '';
        document.getElementById('columnBoard').style.display = isColumns ? 'grid' : 'none';
        if(isColumns) ColumnBoard.render();
        Store.lastView = isColumns ? 'columns' : 'map';
        try{ localStorage.setItem('fwb_lastView', Store.lastView); }catch(e){}
      });
    });
    // 页面打开时，直接应用 Store.lastView（已经在 Store 初始化时从 localStorage
    // 读出来了），不用等你点一下才切过去——地图 tab 默认在 HTML 里是 active 的，
    // 如果记住的是分栏，这里要把 active 状态和显示都手动挪过去
    if(Store.lastView === 'columns'){
      document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active', t.dataset.view==='columns'));
      document.getElementById('mapCardWrap').style.display = 'none';
      document.getElementById('columnBoard').style.display = 'grid';
    }

    // 年份 rail
    /* 拖动滑块时 'input' 事件是连续触发的（快速拖动一下可能几十次），
       而 App.renderYear() 要重算每个国家轮廓的高亮状态、可能重建整个分栏/弹窗的 HTML，
       不算便宜。用 requestAnimationFrame 节流：Store.currentYear 和顶部的年份大数字
       依然每次都同步更新（这两步很便宜，视觉上完全跟手），只有真正"重渲染"这个
       重操作合并到每一帧最多跑一次，快速拖动时不会攒一堆重复渲染排队执行。 */
    let yearRenderScheduled = false;
    document.getElementById('yearSlider').addEventListener('input', e=>{
      Store.currentYear = Math.round(+e.target.value);
      document.getElementById('yearInput').value = Store.currentYear;
      if(!yearRenderScheduled){
        yearRenderScheduled = true;
        requestAnimationFrame(()=>{
          yearRenderScheduled = false;
          App.renderYear();
        });
      }
    });
    document.getElementById('yearInput').addEventListener('change', e=>{
      let y = parseInt(e.target.value,10);
      if(isNaN(y)) return;
      y = Math.min(Math.max(y, Store.yearMin), Store.yearMax);
      Store.currentYear = y;
      document.getElementById('yearSlider').value = y;
      App.renderYear();
    });
    document.getElementById('yearInput').addEventListener('focus', e=>{ e.target.select(); });
    document.getElementById('yearInput').addEventListener('click', e=>{ e.target.select(); });

    /* 鼠标移到年份轴任意位置，滚轮直接调年份，不用非得拖那根滑块
       跟上面滑块拖动同理，快速滚动也会连续触发，复用同一个节流开关 */
    document.querySelector('.year-rail').addEventListener('wheel', e=>{
      e.preventDefault();
      const step = 1;
      const delta = e.deltaY > 0 ? step : -step;
      const y = Math.min(Math.max(Store.currentYear + delta, Store.yearMin), Store.yearMax);
      if(y === Store.currentYear) return;
      Store.currentYear = y;
      document.getElementById('yearSlider').value = y;
      document.getElementById('yearInput').value = y;
      if(!yearRenderScheduled){
        yearRenderScheduled = true;
        requestAnimationFrame(()=>{
          yearRenderScheduled = false;
          App.renderYear();
        });
      }
    }, { passive:false });

    /* Global 色段悬浮提示：鼠标划过滑块轨道时，实时算鼠标位置对应哪一年，
       查这一年是否落在某个 Global 事件的区间里——不依赖悬停在色段本身上
       （色段是 pointer-events:none 的，划不到），所以滑块的原生拖动/点击
       行为完全不受影响，这条监听器只负责"要不要显示提示"，不碰年份状态。 */
    const yearSliderEl = document.getElementById('yearSlider');
    yearSliderEl.addEventListener('mousemove', e=>{
      const rect = yearSliderEl.getBoundingClientRect();
      const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      const hoverYear = Math.round(Store.yearMin + pct * (Store.yearMax - Store.yearMin));
      const hits = Store.vault.events.filter(ev=>
        ev.keyEra==='Global' && ev.start &&
        hoverYear >= ev.start.year && hoverYear <= (ev.end ? ev.end.year : ev.start.year)
      );
      if(hits.length){
        ChipTooltip.showAt(e.clientX, e.clientY, hits.map(h=>h.title));
      } else {
        ChipTooltip.hide();
      }
    });
    yearSliderEl.addEventListener('mouseleave', ()=> ChipTooltip.hide());

    // 地图空白处点击：关闭悬浮卡（国家色块自己的点击已经 stopPropagation 了，
    // 走不到这里；这个判断是给"万一有例外"留的防御性检查）
    document.getElementById('mapStage').addEventListener('click', (e)=>{
      if(e.target.closest('.popover') || e.target.closest('.country')) return;
      const pop = document.getElementById('mapPopover');
      if(pop){ pop.remove(); Store.selectedScope=null; document.querySelectorAll('.country.registered').forEach(p=>p.classList.remove('active')); }
    });

    // 抽屉关闭
    document.getElementById('drawerClose').addEventListener('click', MapView.closeDrawer);
    document.getElementById('drawerBackdrop').addEventListener('click', MapView.closeDrawer);

    // 主体看板：两个输入框任一变化就重新渲染对比
    document.getElementById('subjectA').addEventListener('input', CompareView.render);
    document.getElementById('subjectB').addEventListener('input', CompareView.render);

    // coverage chip 悬浮详情：事件委托挂在 body 上
    document.body.addEventListener('mouseover', e=>{
      const chip = e.target.closest('.coverage-chip');
      if(chip) ChipTooltip.show(chip);
    });
    document.body.addEventListener('mouseout', e=>{
      const chip = e.target.closest('.coverage-chip');
      if(chip && !chip.contains(e.relatedTarget)) ChipTooltip.hide();
    });
    document.body.addEventListener('focusin', e=>{
      const chip = e.target.closest('.coverage-chip');
      if(chip) ChipTooltip.show(chip);
    });
    document.body.addEventListener('focusout', e=>{
      if(e.target.closest('.coverage-chip')) ChipTooltip.hide();
    });
  }
};

App.init();
</script>
